          description: "변경 사유. 앞뒤 공백 제거 후 1~255자이며, 같은 역할을 다시 요청할 때도 필수입니다."
          example: "운영 관리자 지정"
          maxLength: 255
          minLength: 1
          type: "string"
        role:
          description: "변경할 역할. MEMBER는 일반 회원, ADMIN은 관리자입니다."
          enum:
          - "MEMBER"
          - "ADMIN"
          example: "ADMIN"
          type: "string"
      required:
      - "reason"
      - "role"
      type: "object"
    MemberAdminResponseRoleChanged:
      properties:
        member_id:
          description: "역할 변경 대상 회원 ID"
          example: 20
          format: "int64"
          type: "integer"
        role:
          description: "요청 처리 후 대상 회원의 역할"
          enum:
          - "MEMBER"
          - "ADMIN"
          example: "ADMIN"
          type: "string"
      required:
      - "member_id"
      - "role"
      type: "object"
    PaymentOperationAdminRequestMarkNotPaid:
      properties:
        evidence_reference:
          description: "내부 사건·조사 문서 참조. 영문자·숫자와 _ - / : . ,만 허용하며 공백 없이 최대 256자입니다. 결제 키·개인정보·결제사 응답은 넣지 않습니다."
          example: "incident/ABC-123"
          maxLength: 256
          minLength: 1
          pattern: "^[A-Za-z0-9_\\-/:.,]+$"
          type: "string"
        expected_version:
          description: "수동 확인 목록의 version. 충돌 시 다시 조회한 값을 사용합니다."
          example: 7
          format: "int64"
          minimum: 0
          type: "integer"
        reason_code:
          description: "미결제를 확인한 증거의 분류"
          enum:
          - "PROVIDER_PAYMENT_NOT_FOUND"
          - "PROVIDER_DASHBOARD_VERIFIED_NOT_PAID"
          - "SETTLEMENT_REPORT_VERIFIED_NOT_PAID"
          example: "PROVIDER_PAYMENT_NOT_FOUND"
          type: "string"
      required:
      - "evidence_reference"
      - "expected_version"
      - "reason_code"
      type: "object"
    PaymentOperationAdminRequestReconciliation:
      properties:
        expected_version:
          description: "수동 확인 목록의 version. 충돌 시 다시 조회한 값을 사용합니다."
          example: 7
          format: "int64"
          minimum: 0
          type: "integer"
      required:
      - "expected_version"
      type: "object"
    PaymentOperationAdminResponseActionAccepted:
      properties:
        operation_uid:
          description: "관리 작업 대상 UUID"
          example: "00000000-0000-0000-0000-000000000040"
          format: "uuid"
          type: "string"
        status:
          description: "관리자용 작업 상태. 대사 접수는 QUEUED, 미결제 확정 반영은 DECLINED입니다."
          enum:
          - "QUEUED"
          - "DECLINED"
          example: "QUEUED"
          type: "string"
        version:
          description: "요청 반영 직후의 버전. 후속 처리로 다시 바뀔 수 있습니다."
          example: 8
          format: "int64"
          minimum: 0
          type: "integer"
      required:
      - "operation_uid"
      - "status"
      - "version"
      type: "object"
    PaymentOperationAdminResponseManualReviewItem:
      properties:
        attempt_count:
          description: "현재 처리 주기의 시도 횟수. 관리자 대사 요청 시 0으로 초기화됩니다."
          example: 5
          format: "int32"
          minimum: 0
          type: "integer"
        available_actions:
          description: "현재 허용된 작업. MARK_NOT_PAID는 미결제 확정 자격이 확인된 CONFIRM 작업에만 포함됩니다."
          items:
            enum:
            - "REQUEST_RECONCILIATION"
            - "MARK_NOT_PAID"
            type: "string"
          type: "array"
        manual_review_count:
          description: "수동 확인 상태에 진입한 누적 횟수"
          example: 1
          format: "int32"
          minimum: 0
          type: "integer"
        operation_type:
          description: "승인(CONFIRM) 또는 취소(CANCEL) 작업"
          enum:
          - "CONFIRM"
          - "CANCEL"
          example: "CONFIRM"
          type: "string"
        operation_uid:
          description: "관리 API 경로의 operationId로 사용할 UUID"
          example: "00000000-0000-0000-0000-000000000040"
          format: "uuid"
          type: "string"
        review_required_at:
          description: "가장 최근 수동 확인 상태에 진입한 UTC 시각"
          example: "2027-01-01T00:00:00Z"
          format: "date-time"
          type: "string"
        version:
          description: "관리 요청의 expected_version으로 사용할 버전"
          example: 7
          format: "int64"
          minimum: 0
          type: "integer"
      required:
      - "attempt_count"
      - "available_actions"
      - "manual_review_count"
      - "operation_type"
      - "operation_uid"
      - "review_required_at"
      - "version"
      type: "object"
    PaymentOperationAdminResponseManualReviewQueue:
      properties:
        has_more:
          description: "limit을 넘는 대기 작업 존재 여부. 다음 페이지 커서는 제공하지 않습니다."
          example: false
          type: "boolean"
        items:
          description: "수동 확인 진입 시각·내부 ID 오름차순의 작업. 없으면 빈 배열"
          items:
            $ref: "#/components/schemas/PaymentOperationAdminResponseManualReviewItem"
          type: "array"
      required:
      - "has_more"
      - "items"
      type: "object"
    SettlementResponseAdminSettlement:
      properties:
        commission_amount:
          description: "net_amount × commission_rate를 정수로 HALF_UP 반올림한 수수료. 음수일 수 있습니다."
          example: 3900
          format: "int64"
          type: "integer"
        commission_rate:
          description: "정산 시 저장한 수수료율. 0.03은 3%이며 PENDING 재집계 시 현재 설정으로 갱신합니다."
          example: 0.03
          type: "number"
        gross_amount:
          description: "해당 월 CONFIRM 원장의 amount 합계. 숙박일이 아닌 원장 생성일 기준"
          example: 150000
          format: "int64"
          type: "integer"
        host_id:
          description: "정산 대상 회원 ID"
          example: 10
          format: "int64"
          type: "integer"
        net_amount:
          description: "gross_amount - refund_amount. 다른 달 매출의 환불로 음수일 수 있습니다."
          example: 130000
          format: "int64"
          type: "integer"
        payout_amount:
          description: "net_amount - commission_amount. 실제 송금 여부를 증명하는 값은 아니며 음수일 수 있습니다."
          example: 126100
          format: "int64"
          type: "integer"
        refund_amount:
          description: "해당 월 CANCEL·PARTIAL_CANCEL 원장의 cancel_amount 합계. 취소일 우선, 없으면 원장 생성일 기준"
          example: 20000
          format: "int64"
          type: "integer"
        settled_at:
          description: "지급 완료 상태를 기록한 서버 UTC 시각(Z). 지급 전에는 null"
          example: "2027-02-01T04:00:00Z"
          format: "date-time"
          type:
          - "string"
          - "null"
        settlement_id:
          description: "정산 ID. 상세 조회·지급 처리 경로의 settlementId"
          example: 101
          format: "int64"
          type: "integer"
        settlement_month:
          description: "정산 월의 1일. 월 집계는 UTC 날짜 기준"
          example: "2027-01-01"
          format: "date"
          type: "string"
        status:
          description: "PENDING: 지급 처리 전, PAID: 지급 완료 상태를 기록함. 외부 송금 결과와는 별개입니다."
          enum:
          - "PENDING"
          - "PAID"
          example: "PAID"
          type: "string"
      required:
      - "commission_amount"
      - "commission_rate"
      - "gross_amount"
      - "host_id"
      - "net_amount"
      - "payout_amount"
      - "refund_amount"
      - "settled_at"
      - "settlement_id"
      - "settlement_month"
      - "status"
      type: "object"
  securitySchemes:
