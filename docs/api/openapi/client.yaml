  /api/v1/accommodations/{accommodationId}/reviews:
    get:
      description: "로그인 없이 숙소의 게시된 리뷰를 조회합니다. 삭제·숨김 리뷰는 제외합니다. 숙소의 현재 게시 상태나 존재 여부는 별도로 확인하지 않으며 결과가 없으면 200과 빈 reviews를 반환합니다.\nLATEST는 작성 시각 내림차순, HIGHEST_RATING은 높은 평점순, LOWEST_RATING은 낮은 평점순입니다.\n평점 동률에서는 작성 시각 내림차순, 작성 시각까지 같으면 리뷰 ID 내림차순입니다.\n\ncursor와 size(기본 20, 1~50)를 사용합니다. 다음 페이지는 page_info.next_cursor를 그대로 전달하며 숙소·정렬을 바꾸면 커서를 생략합니다.\n조회 사이에 리뷰 작성·수정·삭제가 있으면 목록과 정렬 위치가 바뀔 수 있습니다. reviewed_at은 최초 작성 시각(UTC)이며 이미지 표시 순서는 보장하지 않습니다.\n"
      operationId: "Review.findReviews"
      parameters:
      - description: "조회할 숙소 ID"
        example: 101
        in: "path"
        name: "accommodationId"
        required: true
        schema:
