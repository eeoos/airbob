  /api/v1/coupons:
    get:
      description: "활성 상태이고 재고 준비를 완료했으며 발급 종료 시각 전인 캠페인만 조회합니다. 발급 시작 전·품절·이미 본인이 발급받은 캠페인도 포함됩니다.\n발급 시작 시각·캠페인 ID 내림차순이며 cursor와 size(기본 20, 1~50)로 다음 페이지를 조회합니다.\n\nissuance_status는 시작 전 UPCOMING이 우선이고, 시작 후 유한 수량의 잔여 재고가 없으면 SOLD_OUT, 그 외 OPEN입니다.\n과거 total_quantity=null은 발급 시작 후 OPEN으로 읽지만 새 무제한 쿠폰을 만들거나 발급할 수 있다는 의미는 아닙니다.\n전체 수량은 잔여 수량이 아닙니다. 발급 시 조건을 다시 확인하므로 목록의 OPEN이 발급 성공을 보장하지 않습니다.\n"
      operationId: "Coupon.findCouponCampaigns"
      parameters:
      - description: "이전 응답 page_info의 next_cursor. 첫 페이지에서는 생략합니다. 필터·정렬을 바꾸면 초기화합니다."
