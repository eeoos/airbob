      description: "본인 리뷰에 이미지를 추가합니다. multipart/form-data에서 파일마다 images 파트를 반복하며 파일 파트의 Content-Type은 image/jpeg 또는 image/png입니다.\n파일당 최대 10MiB, multipart 헤더·구분자를 포함한 요청 전체는 최대 20MiB입니다. 성공은 201이며 data.uploaded_images에 이번에 추가한 이미지의 id와 image_url을 반환합니다.\n\n없거나 타인의 리뷰는 404/V001입니다. 현재 이미지 API는 리뷰의 삭제·숨김 상태를 별도로 제한하지 않습니다.\nimages 파트 누락은 400/C001, 빈 파일은 400/I007, 잘못된 파일 Content-Type은 400/I003입니다.\n서버 업로드 크기 제한은 413/I009, 서비스의 개별 파일 검사에서 발견한 크기 초과는 400/I008입니다. multipart가 아닌 요청은 415/C011입니다.\n"
      operationId: "Review.uploadReviewImages"
      parameters:
      - description: "본인이 작성한 리뷰 ID"
        example: 201
        in: "path"
        name: "reviewId"
        required: true
        schema:
          format: "int64"
          type: "integer"
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                images:
                  items:
                    format: "binary"
                    type: "string"
                  type: "array"
              required:
              - "images"
              type: "object"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseImageResponseImageUploadResult"
          description: "이미지 추가 완료"
        "400":
          content:
            application/json:
              examples:
                C001:
                  summary: "유효하지 않은 입력 값입니다."
                  value:
                    error:
                      code: "C001"
                      errors: []
                      message: "유효하지 않은 입력 값입니다."
                      status: 400
                    success: false
                C004:
                  summary: "유효하지 않은 타입 값입니다."
                  value:
                    error:
                      code: "C004"
                      errors: []
                      message: "유효하지 않은 타입 값입니다."
                      status: 400
                    success: false
                I003:
                  summary: "지원하지 않는 이미지 형식입니다. (JPG, PNG만 가능합니다)"
                  value:
                    error:
                      code: "I003"
                      errors: []
                      message: "지원하지 않는 이미지 형식입니다. (JPG, PNG만 가능합니다)"
                      status: 400
                    success: false
                I007:
                  summary: "이미지 파일이 비어 있습니다."
                  value:
                    error:
                      code: "I007"
                      errors: []
                      message: "이미지 파일이 비어 있습니다."
                      status: 400
                    success: false
                I008:
                  summary: "이미지 파일 크기는 10MB를 초과할 수 없습니다."
                  value:
                    error:
                      code: "I008"
                      errors: []
                      message: "이미지 파일 크기는 10MB를 초과할 수 없습니다."
                      status: 400
                    success: false
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "오류 응답. examples에서 업무 오류 코드와 메시지를 확인합니다."
        "401":
          content:
            application/json:
              examples:
                M004:
                  summary: "인증이 필요합니다."
                  value:
                    error:
                      code: "M004"
                      errors: []
                      message: "인증이 필요합니다."
                      status: 401
                    success: false
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "오류 응답. examples에서 업무 오류 코드와 메시지를 확인합니다."
        "404":
          content:
            application/json:
              examples:
                V001:
                  summary: "존재하지 않는 리뷰입니다."
                  value:
                    error:
                      code: "V001"
                      errors: []
                      message: "존재하지 않는 리뷰입니다."
                      status: 404
                    success: false
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "오류 응답. examples에서 업무 오류 코드와 메시지를 확인합니다."
        "413":
          content:
            application/json:
              examples:
                I009:
                  summary: "파일 또는 요청 전체의 업로드 허용 크기를 초과했습니다."
                  value:
                    error:
                      code: "I009"
                      errors: []
                      message: "파일 또는 요청 전체의 업로드 허용 크기를 초과했습니다."
                      status: 413
                    success: false
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "오류 응답. examples에서 업무 오류 코드와 메시지를 확인합니다."
        "415":
          content:
            application/json:
              examples:
                C011:
                  summary: "지원하지 않는 요청 Content-Type입니다."
                  value:
