          description: "오류 응답. examples에서 업무 오류 코드와 메시지를 확인합니다."
        "500":
          content:
            application/json:
              examples:
                C003:
                  summary: "서버 내부에서 처리할 수 없는 오류가 발생했습니다."
                  value:
                    error:
                      code: "C003"
                      errors: []
                      message: "서버 내부에서 처리할 수 없는 오류가 발생했습니다."
                      status: 500
                    success: false
                I001:
                  summary: "이미지 업로드 중 오류가 발생했습니다."
                  value:
                    error:
                      code: "I001"
                      errors: []
                      message: "이미지 업로드 중 오류가 발생했습니다."
                      status: 500
                    success: false
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "오류 응답. examples에서 업무 오류 코드와 메시지를 확인합니다."
      security:
      - sessionCookie: []
      summary: "리뷰 이미지 업로드"
      tags:
      - "리뷰"
  /api/v1/reviews/{reviewId}/images/{imageId}:
    delete:
      description: "본인 리뷰의 이미지 연결을 삭제합니다. imageId는 업로드 응답 또는 리뷰 목록의 images[].id이며 본문은 없습니다.\n이미지가 없거나 다른 회원의 이미지이면 403/V006, 본인의 이미지지만 reviewId가 실제 소속 리뷰와 다르면 400/C009입니다.\n리뷰의 삭제·숨김 상태와 관계없이 본인 이미지 삭제가 가능합니다. 성공은 200과 {\"success\":true}, 삭제 후 같은 요청은 403/V006입니다.\n파일 저장소 삭제는 별도로 시도하며, 200이 파일 저장소에서의 삭제 완료까지 보장하지는 않습니다.\n"
      operationId: "Review.deleteReviewImage"
      parameters:
      - description: "이미지가 속한 리뷰 ID"
        example: 201
        in: "path"
        name: "reviewId"
        required: true
        schema:
          format: "int64"
          type: "integer"
      - description: "리뷰 이미지 ID"
