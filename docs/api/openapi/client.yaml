  /api/v1/reservation-quotes:
    post:
      description: "로그인한 회원의 가격·쿠폰·숙박 조건을 견적으로 저장합니다. 숙소 현지 오늘부터 3개월 범위에서 체크아웃일이 체크인일보다 뒤여야 하며, 당일 예약은 숙소 체크인 시각 전까지만 가능합니다. 예시 날짜는 실행 시 예약 가능한 날짜로 바꿉니다.\n\n현재 재고를 조회하지만 잠그거나 확보하지 않으며 쿠폰도 사용 처리하지 않습니다. coupon_id는 보유 쿠폰의 캠페인 ID입니다. 성공 응답의 quote_uid를 체크아웃에 사용합니다.\n\n견적 자체의 시간 만료는 없지만 데이터 보관 정책에 따라 삭제될 수 있습니다. 체크아웃에서 가격·할인·숙소·재고를 다시 검사합니다.\n"
      operationId: "Reservation.createQuote"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReservationRequestQuote"
        required: true
      responses:
        "201":
          content:
