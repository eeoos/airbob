  /api/v1/reservations/{reservationUid}:
    post:
      description: "본인 예약을 취소합니다. cancel_reason은 공백만 있는 값을 제외한 최대 200자로 필수입니다. 유료 예약은 전액 취소만 지원하며 cancel_amount는 생략·null 또는 현재 결제 잔액 전액입니다. 0원 예약은 금액을 생략하거나 null로 보냅니다.\n\n새 취소는 체크인 시각 전까지만 가능합니다. 유료 예약은 CONFIRMED 또는 CANCELLATION_FAILED에서 취소를 접수합니다. 이미 취소 중이거나 취소된 예약은 동일 사유와 금액으로 요청하면 기존 작업을 반환하며, 내용이 다르면 409/P006입니다. 0원 예약은 즉시 취소되고 반복 요청도 성공합니다.\n\n응답은 모두 202와 {\"success\":true}입니다. 유료 취소는 Location 헤더의 작업 조회 URL에서 결과를 확인하고, 0원 취소는 Location 없이 완료되므로 예약 상세를 확인합니다.\n\n다른 회원의 예약은 403/P004, 없는 예약은 404/R001, 해석할 수 없는 예약 UID는 400/C001입니다. 결제 전 보유 해제는 DELETE /reservations/{reservationUid}/hold를 사용합니다.\n"
      operationId: "Reservation.cancelReservation"
      parameters:
      - description: "예약 생성 응답의 reservation_uid"
        example: "00000000-0000-0000-0000-000000000020"
        in: "path"
        name: "reservationUid"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequestCancel"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseVoid"
          description: "요청 접수"
          headers:
            Location:
              description: "비동기 취소 작업이 있을 때 상태 조회 URL"
              schema:
                type: "string"
              style: "simple"
        "400":
          content:
            application/json:
              examples:
                C001:
                  summary: "유효하지 않은 입력 값입니다."
                  value:
                    error:
                      code: "C001"
                      errors: []
                      message: "유효하지 않은 입력 값입니다."
                      status: 400
                    success: false
