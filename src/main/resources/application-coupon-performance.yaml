# Existing V28 dataset only. This profile includes coupon-benchmark via application.yaml.
spring:
  datasource:
    hikari:
      read-only: false
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        show_sql: false
        format_sql: false
        generate_statistics: false
  flyway:
    baseline-on-migrate: false
    clean-disabled: true
  kafka:
    listener:
      auto-startup: false
    admin:
      auto-create: false

reservation:
  inventory:
    startup:
      enabled: false
    seed:
      enabled: false
    retention:
      enabled: false

accommodation:
  detail-cache:
    enabled: false
    invalidation:
      kafka:
        auto-startup: false
  indexing:
    bootstrap:
      enabled: false
    kafka:
      auto-startup: false

operator-alert:
  kafka:
    auto-startup: false
  slack:
    enabled: false

payment:
  toss:
    enabled: false
    secret-key: coupon-performance-disabled
    base-url: http://127.0.0.1

google:
  api:
    enabled: false
    key: coupon-performance-disabled

cloud:
  aws:
    s3:
      write-enabled: false
      bucket: coupon-performance-disabled
  cloudfront:
    domain: https://invalid.coupon-performance

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  health:
    elasticsearch:
      enabled: false

logging:
  level:
    kr.kro.airbob.domain.auth.filter.SessionAuthFilter: WARN
    org.hibernate.SQL: "OFF"
    org.hibernate.orm.jdbc.bind: "OFF"
