spring:
  application:
    name: airbob

  profiles:
    active: dev
    group:
      traffic-benchmark:
        - performance-lab

  task:
    scheduling:
      pool:
        size: ${SPRING_TASK_SCHEDULING_POOL_SIZE:4}

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          time_zone: UTC

  datasource:
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  flyway:
    enabled: true               # Flyway 사용 활성화
    locations: classpath:db/migration  # 마이그레이션 파일 위치(기본값)
    baseline-on-migrate: true   # 기존 DB에 적용 시 필수(옵션)
    baseline-version: 1          # Baseline 기준 버전(옵션)

  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  kafka:
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: MANUAL
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

google:
  api:
    enabled: ${GOOGLE_API_ENABLED:true}
    key: ${GOOGLE_API_KEY}

operator-alert:
  kafka:
    group: ${OPERATOR_ALERT_GROUP:operator-alert-delivery-group}
    auto-startup: ${OPERATOR_ALERT_KAFKA_AUTO_STARTUP:true}
    attempts: ${OPERATOR_ALERT_KAFKA_ATTEMPTS:4}
    backoff-ms: ${OPERATOR_ALERT_KAFKA_BACKOFF_MS:30000}
  slack:
    enabled: ${OPERATOR_ALERT_SLACK_ENABLED:true}
    webhook-url: ${OPERATOR_ALERT_SLACK_WEBHOOK_URL:${SLACK_WEBHOOK_URL:}}
    connect-timeout: ${OPERATOR_ALERT_SLACK_CONNECT_TIMEOUT:2s}
    read-timeout: ${OPERATOR_ALERT_SLACK_READ_TIMEOUT:10s}

payment:
  operation:
    lease-duration: ${PAYMENT_OPERATION_LEASE_DURATION:30s}
    scheduler-delay: ${PAYMENT_OPERATION_SCHEDULER_DELAY:10s}
    batch-size: ${PAYMENT_OPERATION_BATCH_SIZE:100}
    max-attempts: ${PAYMENT_OPERATION_MAX_ATTEMPTS:5}
    retry-initial-delay: ${PAYMENT_OPERATION_RETRY_INITIAL_DELAY:10s}
    retry-max-delay: ${PAYMENT_OPERATION_RETRY_MAX_DELAY:5m}
    execution-fence-timeout: ${PAYMENT_OPERATION_EXECUTION_FENCE_TIMEOUT:15s}
    execution-fence-network-timeout: ${PAYMENT_OPERATION_EXECUTION_FENCE_NETWORK_TIMEOUT:20s}
    execution-fence-max-concurrency: ${PAYMENT_OPERATION_EXECUTION_FENCE_MAX_CONCURRENCY:2}
    kafka:
      group: ${PAYMENT_OPERATION_GROUP:payment-operation-execution-group}
      attempts: ${PAYMENT_OPERATION_KAFKA_ATTEMPTS:4}
      backoff-ms: ${PAYMENT_OPERATION_KAFKA_BACKOFF_MS:30000}
  toss:
    enabled: ${TOSS_PAYMENTS_ENABLED:true}
    secret-key: ${TOSS_SECRET_KEY}
    base-url: https://api.tosspayments.com
    connect-timeout: ${TOSS_CONNECT_TIMEOUT:2s}
    read-timeout: ${TOSS_READ_TIMEOUT:10s}

cloud:
  aws:
    s3:
      write-enabled: ${AWS_S3_WRITE_ENABLED:true}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

settlement:
  commission-rate: 0.03   # 호스트 정산 수수료율(net에 부과). 정산 레코드에 스냅샷됨

reservation:
  quote:
    duration: ${RESERVATION_QUOTE_DURATION:5m}
    retention: ${RESERVATION_QUOTE_RETENTION:30d}
    cleanup-batch-size: ${RESERVATION_QUOTE_CLEANUP_BATCH_SIZE:500}
    cleanup-interval: ${RESERVATION_QUOTE_CLEANUP_INTERVAL:10m}
    max-cleanup-batches-per-run: ${RESERVATION_QUOTE_MAX_CLEANUP_BATCHES_PER_RUN:10}
    cleanup-transaction-timeout-seconds: ${RESERVATION_QUOTE_CLEANUP_TRANSACTION_TIMEOUT_SECONDS:10}
  hold:
    duration: ${RESERVATION_HOLD_DURATION:15m}
  payment-attempt:
    minimum-remaining: ${RESERVATION_PAYMENT_ATTEMPT_MINIMUM_REMAINING:90s}
  expiration:
    cleanup-batch-size: ${RESERVATION_EXPIRATION_CLEANUP_BATCH_SIZE:100}
    cleanup-interval: ${RESERVATION_EXPIRATION_CLEANUP_INTERVAL:30s}
    max-batches-per-run: ${RESERVATION_EXPIRATION_MAX_BATCHES_PER_RUN:10}
    transaction-timeout-seconds: ${RESERVATION_EXPIRATION_TRANSACTION_TIMEOUT_SECONDS:10}
    history-batch-size: ${RESERVATION_HISTORY_BATCH_SIZE:100}

accommodation:
  indexing:
    bootstrap:
      enabled: ${ACCOMMODATION_INDEX_BOOTSTRAP_ENABLED:true}
    kafka:
      group: ${ACCOMMODATION_INDEXING_GROUP:accommodation-indexing-group}
      auto-startup: ${ACCOMMODATION_INDEXING_AUTO_STARTUP:true}
      attempts: ${ACCOMMODATION_INDEXING_KAFKA_ATTEMPTS:4}
      backoff-ms: ${ACCOMMODATION_INDEXING_KAFKA_BACKOFF_MS:30000}
  detail-cache:
    enabled: ${ACCOMMODATION_DETAIL_CACHE_ENABLED:true}
    ttl: ${ACCOMMODATION_DETAIL_CACHE_TTL:10m}
    ttl-jitter: ${ACCOMMODATION_DETAIL_CACHE_TTL_JITTER:2m}
    negative-ttl: ${ACCOMMODATION_DETAIL_CACHE_NEGATIVE_TTL:45s}
    negative-ttl-jitter: ${ACCOMMODATION_DETAIL_CACHE_NEGATIVE_TTL_JITTER:15s}
    lock-wait: ${ACCOMMODATION_DETAIL_CACHE_LOCK_WAIT:2s}
    local-load-wait: ${ACCOMMODATION_DETAIL_CACHE_LOCAL_LOAD_WAIT:5s}
    load-permit-ttl: ${ACCOMMODATION_DETAIL_CACHE_LOAD_PERMIT_TTL:30s}
    redis-connect-timeout: ${ACCOMMODATION_DETAIL_CACHE_REDIS_CONNECT_TIMEOUT:1s}
    redis-command-timeout: ${ACCOMMODATION_DETAIL_CACHE_REDIS_COMMAND_TIMEOUT:1s}
    redis:
      host: ${ACCOMMODATION_DETAIL_CACHE_REDIS_HOST:localhost}
      port: ${ACCOMMODATION_DETAIL_CACHE_REDIS_PORT:6380}
      database: ${ACCOMMODATION_DETAIL_CACHE_REDIS_DATABASE:0}
      username: ${ACCOMMODATION_DETAIL_CACHE_REDIS_USERNAME:}
      password: ${ACCOMMODATION_DETAIL_CACHE_REDIS_PASSWORD:}
    invalidation:
      kafka:
        group: ${ACCOMMODATION_DETAIL_CACHE_INVALIDATION_GROUP:accommodation-detail-cache-invalidation-group}
        auto-startup: ${ACCOMMODATION_DETAIL_CACHE_INVALIDATION_AUTO_STARTUP:true}
        attempts: ${ACCOMMODATION_DETAIL_CACHE_INVALIDATION_ATTEMPTS:4}
        backoff-ms: ${ACCOMMODATION_DETAIL_CACHE_INVALIDATION_BACKOFF_MS:30000}

benchmark:
  read-model:
    enabled: ${BENCHMARK_READ_MODEL_ENABLED:false}
    token: ${BENCHMARK_READ_MODEL_TOKEN:}
