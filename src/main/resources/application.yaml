spring:
  application:
    name: airbob

  profiles:
    active: dev

  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          time_zone: UTC

  datasource:
    hikari:
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  flyway:
    enabled: true               # Flyway 사용 활성화
    locations: classpath:db/migration  # 마이그레이션 파일 위치(기본값)
    baseline-on-migrate: true   # 기존 DB에 적용 시 필수(옵션)
    baseline-version: 1          # Baseline 기준 버전(옵션)

  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  kafka:
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.kafka.dead-letter-publishing.topic-name: PAYMENT.events.DLT
    listener:
      ack-mode: MANUAL
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

google:
  api:
    key: ${GOOGLE_API_KEY}

slack:
  webhook:
    url: ${SLACK_WEBHOOK_URL}
  notification:
    enabled: true

payment:
  operation:
    lease-duration: ${PAYMENT_OPERATION_LEASE_DURATION:30s}
    scheduler-delay: ${PAYMENT_OPERATION_SCHEDULER_DELAY:10s}
    batch-size: ${PAYMENT_OPERATION_BATCH_SIZE:100}
    max-attempts: ${PAYMENT_OPERATION_MAX_ATTEMPTS:5}
    retry-initial-delay: ${PAYMENT_OPERATION_RETRY_INITIAL_DELAY:10s}
    retry-max-delay: ${PAYMENT_OPERATION_RETRY_MAX_DELAY:5m}
    recovery-publication-interval: ${PAYMENT_OPERATION_RECOVERY_PUBLICATION_INTERVAL:10s}
  toss:
    secret-key: ${TOSS_SECRET_KEY}
    base-url: https://api.tosspayments.com
    connect-timeout: ${TOSS_CONNECT_TIMEOUT:2s}
    read-timeout: ${TOSS_READ_TIMEOUT:10s}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

settlement:
  commission-rate: 0.03   # 호스트 정산 수수료율(net에 부과). 정산 레코드에 스냅샷됨

reservation:
  expiration:
    history-batch-size: ${RESERVATION_HISTORY_BATCH_SIZE:100}

accommodation:
  detail-cache:
    ttl: ${ACCOMMODATION_DETAIL_CACHE_TTL:10m}
    ttl-jitter: ${ACCOMMODATION_DETAIL_CACHE_TTL_JITTER:2m}
    negative-ttl: ${ACCOMMODATION_DETAIL_CACHE_NEGATIVE_TTL:45s}
    negative-ttl-jitter: ${ACCOMMODATION_DETAIL_CACHE_NEGATIVE_TTL_JITTER:15s}
    lock-wait: ${ACCOMMODATION_DETAIL_CACHE_LOCK_WAIT:2s}
    local-load-wait: ${ACCOMMODATION_DETAIL_CACHE_LOCAL_LOAD_WAIT:5s}
    load-permit-ttl: ${ACCOMMODATION_DETAIL_CACHE_LOAD_PERMIT_TTL:30s}
    redis-connect-timeout: ${ACCOMMODATION_DETAIL_CACHE_REDIS_CONNECT_TIMEOUT:1s}
    redis-command-timeout: ${ACCOMMODATION_DETAIL_CACHE_REDIS_COMMAND_TIMEOUT:1s}
    redis:
      host: ${ACCOMMODATION_DETAIL_CACHE_REDIS_HOST:localhost}
      port: ${ACCOMMODATION_DETAIL_CACHE_REDIS_PORT:6380}
      database: ${ACCOMMODATION_DETAIL_CACHE_REDIS_DATABASE:0}
      username: ${ACCOMMODATION_DETAIL_CACHE_REDIS_USERNAME:}
      password: ${ACCOMMODATION_DETAIL_CACHE_REDIS_PASSWORD:}

benchmark:
  read-model:
    enabled: ${BENCHMARK_READ_MODEL_ENABLED:false}
    token: ${BENCHMARK_READ_MODEL_TOKEN:}
