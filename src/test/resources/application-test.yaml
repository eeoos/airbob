spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:mysql://localhost:3306/testdb
    username: test
    password: test
    driver-class-name: com.mysql.cj.jdbc.Driver

  # [Redis]
  data:
    redis:
      host: localhost
      port: 6379

  # [Kafka]
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false

  # [Elasticsearch]
  elasticsearch:
    uris: http://localhost:9200
    username: dummy
    password: dummy

cloud:
  aws:
    credentials:
      access-key: dummy-access-key
      secret-key: dummy-secret-key
    region:
      static: ap-northeast-2
    s3:
      bucket: dummy-bucket
    stack:
      auto: false
  cloudfront:
    domain: dummy_cloudfront.cloudfront.net

# 더미 값
google:
  api:
    key: dummy-google-key

slack:
  webhook:
    url: https://hooks.slack.com/services/dummy/url

payment:
  toss:
    secret-key: dummy-toss-secret-key
    base-url: https://api.tosspayments.com

toss:
  client-key: dummy-client-key
  secret-key: dummy-toss-secret-key

accommodation:
  indexing:
    kafka:
      auto-startup: false
  detail-cache:
    redis:
      host: ${ACCOMMODATION_DETAIL_CACHE_REDIS_HOST:${spring.data.redis.host:localhost}}
      port: ${ACCOMMODATION_DETAIL_CACHE_REDIS_PORT:${spring.data.redis.port:6379}}
