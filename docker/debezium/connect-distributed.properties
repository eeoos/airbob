# Kafka Connect distributed worker configuration.
config.providers=env
config.providers.env.class=org.apache.kafka.common.config.provider.EnvVarConfigProvider
config.providers.env.param.allowlist.pattern=^(DEBEZIUM_DATABASE_USER|DEBEZIUM_DATABASE_PASSWORD|DEBEZIUM_KAFKA_BOOTSTRAP_SERVERS)$

bootstrap.servers=${env:DEBEZIUM_KAFKA_BOOTSTRAP_SERVERS}
group.id=debezium-connect

config.storage.topic=DEBEZIUM_CONNECT_CONFIGS
offset.storage.topic=DEBEZIUM_CONNECT_OFFSETS
status.storage.topic=DEBEZIUM_CONNECT_STATUSES

# 단일 노드용 replication factor
config.storage.replication.factor=1
offset.storage.replication.factor=1
status.storage.replication.factor=1

# Outbox records are raw string keys and raw JSON string values.
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.storage.StringConverter
header.converter=org.apache.kafka.connect.storage.StringConverter

# Kafka Connect's internal records remain structured JSON.
internal.key.converter=org.apache.kafka.connect.json.JsonConverter
internal.value.converter=org.apache.kafka.connect.json.JsonConverter
internal.key.converter.schemas.enable=false
internal.value.converter.schemas.enable=false

# Plugin path
plugin.path=/opt/kafka/connect-plugins

# REST API
rest.port=8083
rest.advertised.host.name=debezium
rest.advertised.port=8083

# Offset flush
offset.flush.interval.ms=10000

# All application topics are provisioned explicitly by kafka-topic-init.
topic.creation.enable=false
