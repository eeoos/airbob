spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      data-source-properties:
        rewriteBatchedStatements: ${JDBC_REWRITE_BATCHED_STATEMENTS:true}

  jpa:
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        default_batch_fetch_size: 100

  flyway:
    url: ${SPRING_DATASOURCE_URL}
    user: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS}
    username: ${ELASTICSEARCH_USERNAME}
    password: ${ELASTIC_PASSWORD}
    connection-timeout: 10s
    socket-timeout: 30s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  # 키 두 개가 모두 있으면 고정 자격증명, 하나라도 비면 AWS SDK 기본 탐색을 쓴다
  # 환경변수가 없을 때 시작 실패나 잘못된 값 바인딩 대신 기본 탐색으로 가도록 빈 기본값을 둔다
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:}
        secret-key: ${AWS_SECRET_ACCESS_KEY:}
      region:
        static: ${AWS_REGION:ap-northeast-2}

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET_NAME}
  cloudfront:
    domain: ${CLOUDFRONT_DOMAIN}

accommodation:
  detail-cache:
    redis:
      host: ${ACCOMMODATION_DETAIL_CACHE_REDIS_HOST:${REDIS_HOST}}
      port: ${ACCOMMODATION_DETAIL_CACHE_REDIS_PORT:6379}

# Actuator exposure, metrics, and log levels come from support/monitoring (monitoring.yml)
# and support/logging (logging.yml).
management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,accommodationInventory
