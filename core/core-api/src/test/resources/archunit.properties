# Frozen dependency rules (kr.kro.airbob.architecture.LegacyDependencyFreezeTest).
# Tests run with the repository root as working directory, so the store path is root-relative.
freeze.store.default.path=core/core-api/src/test/resources/archunit_store
# A missing store fails instead of silently recording every current violation.
freeze.store.default.allowStoreCreation=false
# Fixed violations are removed from the store; commit the shrunk store with the fix.
freeze.store.default.allowStoreUpdate=true
# Import only application classes. Resolving every referenced library class from the classpath costs
# enough heap to exhaust the shared test JVM; the rules only need application classes and type names.
resolveMissingDependenciesFromClassPath=false
