name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build-only:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify AWS service bundle contracts
        run: |
          bash infra/aws/tests/service-bundle-verifier-test.sh
          bash infra/aws/tests/app-runtime-env-test.sh
          bash infra/aws/tests/all-service-bundles-test.sh
          bash infra/aws/tests/package-service-bundles-test.sh

      - name: Verify immutable AWS image publication contracts
        run: bash infra/aws/tests/image-publication-test.sh

      - name: Build and Test
        run: ./gradlew clean build

      - name: Verify AWS performance-lab application contracts
        run: |
          ./gradlew test \
            --tests "kr.kro.airbob.config.PerformanceLabRedisEndpointConfigurationTest" \
            --tests "kr.kro.airbob.config.PerformanceLabProfileConfigurationTest" \
            --tests "kr.kro.airbob.config.TrafficBenchmarkProfileConfigurationTest" \
            --tests "kr.kro.airbob.common.monitoring.RedisMonitoringConfigurationTest"
