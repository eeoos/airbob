name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build-only:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Terraform 1.15.5
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.5
          terraform_wrapper: false

      - name: Verify AWS service bundle contracts
        run: |
          bash infra/aws/tests/service-bundle-verifier-test.sh
          bash infra/aws/tests/app-runtime-env-test.sh
          bash infra/aws/tests/all-service-bundles-test.sh
          bash infra/aws/tests/package-service-bundles-test.sh

      - name: Verify immutable AWS image publication contracts
        run: bash infra/aws/tests/image-publication-test.sh

      - name: Verify AWS foundation and Phase 2-4 Terraform contracts
        run: |
          bash infra/aws/tests/foundation-test.sh
          bash infra/aws/tests/dns-lab-state-test.sh
          bash infra/aws/tests/lab-phase2-test.sh
          bash infra/aws/tests/data-bootstrap-test.sh
          bash infra/aws/tests/app-asg-test.sh
          bash infra/aws/tests/network-egress-test.sh
          bash infra/aws/tests/service-bundle-publisher-test.sh

      - name: Verify AWS performance-lab operator contracts
        run: |
          bash infra/aws/tests/orchestration-lease-test.sh
          bash infra/aws/tests/aws-dns-cutover-test.sh
          bash infra/aws/tests/aws-lab-operator-test.sh
          bash infra/aws/tests/expiry-cleanup-test.sh
          bash infra/aws/tests/measurement-policy-test.sh

      - name: Install pinned k6 for traffic contracts
        run: |
          source infra/aws/toolchain.env
          archive="k6-v${AIRBOB_K6_VERSION}-linux-amd64.tar.gz"
          curl --fail --silent --show-error --location --retry 5 \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/grafana/k6/releases/download/v${AIRBOB_K6_VERSION}/$archive"
          printf '%s  %s\n' "$AIRBOB_K6_LINUX_AMD64_SHA256" "$RUNNER_TEMP/$archive" \
            | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/k6-v${AIRBOB_K6_VERSION}-linux-amd64" >> "$GITHUB_PATH"

      - name: Verify AWS traffic discovery contracts
        env:
          K6_NO_USAGE_REPORT: 'true'
        run: |
          k6 run --address '' load-test/k6/test/traffic-benchmark-test.js
          MODE=inspect ROLE=guest TARGET=accommodation-detail \
            RATE=1 DURATION=1s MIN_COMPLETED_SAMPLES=1 \
            ROUND=1 RUN_ORDER=1 RUN_LABEL=guest-test \
            APP_COMMIT=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa APP_INSTANCE_COUNT=1 \
            BASE_URL=http://127.0.0.1:8080 \
            BENCHMARK_MANIFEST="$PWD/load-test/k6/test/fixtures/nplus1-v1.json" \
            k6 run --address '' load-test/k6/test/guest-read-traffic-test.js
          node load-test/k6/test/prepare-benchmark-sessions-test.js
          node load-test/k6/test/traffic-result-aggregation-test.mjs
          bash load-test/k6/test/run-aws-discovery-test.sh

      - name: Build and Test
        run: ./gradlew clean build

      - name: Verify AWS performance-lab application contracts
        run: |
          ./gradlew test \
            --tests "kr.kro.airbob.config.PerformanceLabRedisEndpointConfigurationTest" \
            --tests "kr.kro.airbob.config.PerformanceLabProfileConfigurationTest" \
            --tests "kr.kro.airbob.config.TrafficBenchmarkProfileConfigurationTest" \
            --tests "kr.kro.airbob.common.monitoring.RedisMonitoringConfigurationTest"
