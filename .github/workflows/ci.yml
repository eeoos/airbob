name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_call:
    inputs:
      build_app:
        description: Build a verified JAR for an explicit AWS image publication
        type: boolean
        default: false
    outputs:
      oci_required:
        value: ${{ jobs.scope.outputs.oci }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.scope.outputs.app }}
      infrastructure: ${{ steps.scope.outputs.infrastructure }}
      data: ${{ steps.scope.outputs.data }}
      oci: ${{ steps.scope.outputs.oci }}
      api_docs: ${{ steps.scope.outputs.api_docs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify change selection and CI result handling
        run: python3 -B -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Select checks from the exact change
        id: scope
        env:
          FORCE_APP: ${{ inputs.build_app || false }}
        run: python3 -B scripts/ci/scope.py

  app:
    needs: scope
    if: needs.scope.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Temurin JDK 21.0.12.1+1
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          # Adoptium SemVer for the four-part Java version 21.0.12.1+1-LTS.
          java-version: '21.0.12+101.0.LTS'
          distribution: 'temurin'
          cache: gradle
      - name: Build and test the application
        run: ./gradlew build
      - name: Keep the tested JAR for this main commit
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-jar-${{ github.sha }}
          path: build/libs/airbob.jar
          if-no-files-found: error
          retention-days: 7

  api_docs:
    name: API documentation
    needs: scope
    if: needs.scope.outputs.api_docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: '21.0.12+101.0.LTS'
          distribution: 'temurin'
          cache: gradle
      - name: Verify generated API contracts
        run: ./gradlew verifyOpenApi
      - name: Keep validated OpenAPI documents
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: openapi-${{ github.sha }}
          path: build/openapi/*.yaml
          if-no-files-found: error
          retention-days: 7

  infrastructure:
    needs: scope
    if: needs.scope.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Terraform 1.15.5
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.5
          terraform_wrapper: false
      - name: Install pinned Docker Compose
        run: |
          source infra/aws/toolchain.env
          compose_config="$RUNNER_TEMP/docker-config"
          compose_plugin="$compose_config/cli-plugins/docker-compose"
          install -d -m 700 "$(dirname "$compose_plugin")"
          curl --fail --silent --show-error --location --retry 5 \
            --output "$compose_plugin" \
            "https://github.com/docker/compose/releases/download/v${AIRBOB_DOCKER_COMPOSE_VERSION}/docker-compose-linux-x86_64"
          printf '%s  %s\n' "$AIRBOB_DOCKER_COMPOSE_LINUX_AMD64_SHA256" "$compose_plugin" \
            | sha256sum --check --status
          chmod 755 "$compose_plugin"
          printf 'DOCKER_CONFIG=%s\n' "$compose_config" >> "$GITHUB_ENV"
          [[ "$(DOCKER_CONFIG="$compose_config" docker compose version --short)" \
            == "$AIRBOB_DOCKER_COMPOSE_VERSION" ]]

      - name: Verify AWS service bundle contracts
        run: |
          bash infra/aws/tests/service-bundle-verifier-test.sh
          bash infra/aws/tests/app-runtime-env-test.sh
          bash infra/aws/tests/all-service-bundles-test.sh
          bash infra/aws/tests/package-service-bundles-test.sh

      - name: Verify local MySQL initialization contract
        run: bash infra/aws/tests/mysql-init-script-test.sh

      - name: Verify immutable AWS image publication contracts
        run: |
          bash infra/aws/tests/image-publication-test.sh
          python3 -m unittest discover -s infra/aws/tests -p 'test_image_publication_scope.py'

      - name: Verify AWS foundation and Phase 2-4 Terraform contracts
        run: |
          bash infra/aws/tests/foundation-test.sh
          bash infra/aws/tests/dns-lab-state-test.sh
          bash infra/aws/tests/lab-phase2-test.sh
          bash infra/aws/tests/data-bootstrap-test.sh
          bash infra/aws/tests/app-asg-test.sh
          bash infra/aws/tests/network-egress-test.sh
          bash infra/aws/tests/service-bundle-publisher-test.sh

      - name: Verify AWS performance-lab operator contracts
        run: |
          bash infra/aws/tests/orchestration-lease-test.sh
          bash infra/aws/tests/aws-dns-cutover-test.sh
          bash infra/aws/tests/aws-lab-operator-test.sh
          bash infra/aws/tests/reset-accommodation-cache-test.sh
          bash infra/aws/tests/expiry-cleanup-test.sh
          bash infra/aws/tests/measurement-policy-test.sh

      - name: Verify AWS dataset manifest validation
        run: bash infra/aws/tests/benchmark-dataset-v2-validator-test.sh

      - name: Verify AWS cache resource contracts
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s infra/aws/tests -p 'test_cache_*.py'


  data:
    needs: scope
    if: needs.scope.outputs.data == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Temurin JDK 21.0.12.1+1
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          # Adoptium SemVer for the four-part Java version 21.0.12.1+1-LTS.
          java-version: '21.0.12+101.0.LTS'
          distribution: 'temurin'
          cache: gradle
      - name: Set up Terraform 1.15.5
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.5
          terraform_wrapper: false
      - name: Verify AWS dataset release production contracts
        run: |
          bash infra/aws/tests/target-fingerprint-test.sh
          bash infra/aws/tests/aws-lab-target-preflight-test.sh
          bash infra/aws/tests/etl-release-database-verifier-test.sh
          bash infra/aws/tests/dataset-attestation-test.sh
          bash infra/aws/tests/elasticsearch-snapshot-producer-test.sh
          bash infra/aws/tests/dataset-release-assembler-test.sh
          bash infra/aws/tests/dataset-release-publisher-test.sh
          bash infra/aws/tests/dataset-release-test.sh
          bash infra/aws/tests/rds-snapshot-promotion-test.sh

      - name: Verify Global B offline Python contracts (Python 3.12+)
        timeout-minutes: 10
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -c "import sys; sys.version_info >= (3, 12) or sys.exit('Global B offline contracts require Python 3.12+'); print(sys.version)"
          (cd infra/aws/tests/fixtures/etl-account-runtime && sha256sum --check SHA256SUMS)
          ./gradlew prepareGrowthBContractTestRuntime
          python3 -m unittest discover -s infra/aws/tests -p 'test_growth_b_*.py' -v
          python3 -m unittest discover -s infra/aws/tests -p 'test_airbob_lab_cli.py' -v
          python3 infra/aws/scripts/test_growth_b_publication.py -v
          python3 infra/aws/tests/test_global_b_infrastructure.py -v

  result:
    name: CI result
    if: always()
    needs: [scope, app, infrastructure, data, api_docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require every selected check to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 -B scripts/ci/check_result.py
