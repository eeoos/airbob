name: PR report

# Posts the report that ci.yml's `report` job collected. ci.yml cannot write to pull requests because
# CD reuses it with contents: read, so posting runs here after the CI run completes.
# workflow_run always uses this file and the scripts from the default branch. The artifact comes from
# the pull request run and is treated as data: scripts/ci/pr_comment.py validates it and posts text.
on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: pr-report-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    name: Post the PR report
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download the report of the CI run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pr-report-${{ github.event.workflow_run.head_sha }}
          path: build/pr-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Create or update the PR report comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          python3 -B scripts/ci/pr_comment.py --dir build/pr-report
          --repository "$GITHUB_REPOSITORY" --head-sha "$HEAD_SHA"
