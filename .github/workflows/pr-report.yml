name: PR report

# Posts the report that ci.yml's `report` job collected. ci.yml cannot write to pull requests because
# CD reuses it with contents: read, so posting runs here after the CI run completes.
# workflow_run always uses this file and the scripts from the default branch. The artifact comes from
# the pull request run and is treated as data: scripts/ci/pr_comment.py validates it and posts text.
on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: pr-report-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    name: Post the PR report
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Full history: the baseline search walks main's first-parent history from the PR base.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download the report of the CI run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pr-report-${{ github.event.workflow_run.head_sha }}
          path: build/pr-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      # The PR base comes from this event, not from the artifact. A failed or slow search must not stop
      # the comment, so the search and the download have their own time limits within the job's.
      - name: Find the main test summary to compare with
        id: baseline
        continue-on-error: true
        timeout-minutes: 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: >-
          python3 -B scripts/ci/pr_baseline.py --facts build/pr-report/facts.json --base "$PR_BASE_SHA"
          --repository "$GITHUB_REPOSITORY" --repository-id "$REPOSITORY_ID"
      - name: Download the main test summary
        id: baseline-download
        if: ${{ steps.baseline.outputs.status == 'found' }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.baseline.outputs.name }}
          path: build/baseline
          run-id: ${{ steps.baseline.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Create or update the PR report comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
          BASELINE_STATUS: ${{ steps.baseline.outputs.status }}
          BASELINE_SEARCHED: ${{ steps.baseline.outputs.searched }}
          BASELINE_DOWNLOAD: ${{ steps.baseline-download.outcome }}
        run: >-
          python3 -B scripts/ci/pr_comment.py --dir build/pr-report
          --repository "$GITHUB_REPOSITORY" --head-sha "$HEAD_SHA"
          --baseline build/baseline/test-summary.json --baseline-sha "$BASELINE_SHA"
          --baseline-status "$BASELINE_STATUS" --baseline-searched "$BASELINE_SEARCHED"
          --baseline-download "$BASELINE_DOWNLOAD"
