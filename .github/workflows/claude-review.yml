name: Claude review
# Quoted: in a plain YAML value, " #" starts a comment and would cut the name.
run-name: "Claude review PR #${{ github.event.workflow_run.pull_requests[0].number }} at ${{ github.event.workflow_run.head_sha }}"

# Second AI review of a pull request (the first, Codex, runs locally before push). claude-review-request.yml
# runs on the PR and holds nothing; when it completes, this workflow runs. workflow_run always uses this
# file and the scripts from the default branch, so the workflow, scripts/ci/claude_review.py, its lock file,
# and the review criteria are main's, never the PR's. The PR is read only as Git objects and API data and
# is never checked out or executed. scripts/ci/claude_review.py sends one Claude Messages API request with
# no tools and posts the result as a new PR comment. It is informational and not part of CI result. It
# lives outside ci.yml because posting needs pull-requests: write, which CD's contents: read call of ci.yml
# cannot grant. claude-code-action is not used: the monthly API credit does not cover runs that the action
# starts. Criteria: docs/development/code-review.md. Verdicts: docs/development/ai-review-log.md.
on:
  workflow_run:
    workflows: [ Claude review request ]
    types: [ completed ]

permissions:
  contents: read
  pull-requests: write

# One review at a time per PR. A run that will not review gets a group of its own, so it cannot replace a
# review that waits in the PR's group.
concurrency:
  group: claude-review-${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: false

jobs:
  review:
    name: Review the pull request
    # Only a successful request from a same-repository PR; the PR number and commits come from GitHub's
    # workflow_run event, not from anything the PR run produced. The event must link exactly one PR, so the
    # base and the comment target are not taken from the wrong PR; with none or several the job is skipped.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.pull_requests[0].number
      && !github.event.workflow_run.pull_requests[1]
    runs-on: ubuntu-latest
    # Measured runs took four to seven and a half minutes; xhigh on a request near the size limit can take longer.
    timeout-minutes: 20
    # id-token: write lets the script exchange this run's GitHub OIDC token for a short-lived Claude API
    # token (workload identity federation), so there is no API key secret.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # The default branch with full history. The PR commits are fetched as objects only; the working tree,
      # and everything this job runs, stays main's.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the pull request commits
        env:
          BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: git fetch --no-tags --quiet origin "$BASE_SHA" "$HEAD_SHA"
      # Every package is pinned by version and hash (uv pip compile --universal --generate-hashes), like the
      # SHA-pinned actions: this job holds an OIDC request token and a pull-requests: write token.
      - name: Install the Anthropic SDK
        run: |
          python3 -m venv "$RUNNER_TEMP/claude-review-venv"
          "$RUNNER_TEMP/claude-review-venv/bin/pip" install --quiet --require-hashes --only-binary :all: \
            -r scripts/ci/claude-review-requirements.txt
      - name: Review with Claude
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Workload identity federation. These IDs are identifiers, not secrets. The rule accepts only the
          # subject repo:eeoos/airbob:ref:refs/heads/main with the claims event_name workflow_run and
          # workflow_ref eeoos/airbob/.github/workflows/claude-review.yml@refs/heads/main, so only this file on
          # main can get a token. Do not add ANTHROPIC_API_KEY: it would take precedence.
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          BASE_SHA: ${{ github.event.workflow_run.pull_requests[0].base.sha }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CRITERIA_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: >-
          "$RUNNER_TEMP/claude-review-venv/bin/python" -B scripts/ci/claude_review.py
          --base "$BASE_SHA" --head "$HEAD_SHA" --criteria "$CRITERIA_SHA"
          --pr "$PR_NUMBER" --repository "$GITHUB_REPOSITORY"
