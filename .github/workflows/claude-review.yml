name: Claude review

# Second AI review of a pull request (the first, Codex, runs locally before push). Claude reads the diff
# and the repository and comments; it is informational and not part of CI result. It lives outside
# ci.yml because posting needs pull-requests: write, which CD's contents: read call of ci.yml cannot grant.
# Criteria: docs/development/code-review.md. Verdicts: docs/development/ai-review-log.md.
on:
  pull_request:
    types: [ opened, reopened, ready_for_review, labeled ]
    paths-ignore: [ 'docs/**', '**/*.md' ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    name: Review the pull request
    # Same-repository PRs only (no secrets for forks). Re-review by adding the claude-review label.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The event's head commit, so the files Claude reads, the diff, and the inline comments all refer
      # to one commit even if the PR moves while this run waits or works. The action then restores
      # .claude/ and CLAUDE.md from the base branch and keeps the PR's versions in .claude-pr/.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Both ends of the change come from the event, so the diff stays the same if the base moves or the
      # PR is merged while this run waits. Claude reads these files instead of running git, whose options
      # (such as --output) could write files.
      - name: Prepare the change for review
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p build/claude-review
          git log --format='%h %s' "$BASE_SHA..$HEAD_SHA" > build/claude-review/commits.txt
          git diff "$BASE_SHA...$HEAD_SHA" > build/claude-review/pr.diff
      - name: Review with Claude
        id: review
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          # Post inline comments directly: classifying them afterwards is a separate API call outside the budget.
          classify_inline_comments: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD: ${{ github.event.pull_request.head.sha }}

            이 PR을 docs/development/code-review.md 기준에 따라 리뷰하라.
            - 변경: build/claude-review/pr.diff, 커밋 목록: build/claude-review/commits.txt, PR 설명: gh pr view
            - 작업 디렉터리는 HEAD 커밋이다. 다만 .claude/와 CLAUDE.md는 base 버전으로 되돌려져 있으니, 이 경로의 PR 버전은 .claude-pr/에서 읽어라.
            - 줄을 특정할 수 있는 지적은 인라인 댓글로 남기고, commit_id에는 HEAD를 넘겨라.
            - 전체 결과는 summary에 요약 댓글 본문으로 써라. 끝에 이번에 단 인라인 댓글의 URL 목록을 붙여라. 요약 댓글은 다음 단계가 게시한다.
          # Read-only tools and inline comments only: no git (its options can write files) and no
          # gh pr comment (it could edit or delete this account's other comments, such as the PR report).
          claude_args: >-
            --model claude-opus-5-5 --max-turns 30 --max-budget-usd 3
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","properties":{"summary":{"type":"string"}},"required":["summary"],"additionalProperties":false}'
      - name: Post the summary comment
        if: ${{ steps.review.outputs.structured_output != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SUMMARY: ${{ fromJSON(steps.review.outputs.structured_output).summary }}
        run: |
          printf '<!-- airbob-claude-review -->\n%s\n\n<sub>리뷰한 커밋: %s · 기준: docs/development/code-review.md · claude-review.yml</sub>\n' \
            "$SUMMARY" "$HEAD_SHA" > "$RUNNER_TEMP/claude-review.md"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/claude-review.md"
