name: Claude review

# Second AI review of a pull request (the first, Codex, runs locally before push). Claude reads the diff
# and the repository and comments; it is informational and not part of CI result. It lives outside
# ci.yml because posting needs pull-requests: write, which CD's contents: read call of ci.yml cannot grant.
# Criteria: docs/development/code-review.md. Verdicts: docs/development/ai-review-log.md.
on:
  pull_request:
    types: [ opened, reopened, ready_for_review, labeled ]
    paths-ignore: [ 'docs/**', '**/*.md' ]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    name: Review the pull request
    # Same-repository PRs only (no secrets for forks). Re-review by adding the claude-review label.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # id-token: write lets the action exchange this run's GitHub OIDC token for a short-lived Claude API
    # token (workload identity federation), so there is no API key secret. Fork PRs get no OIDC token.
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # The event's head commit, so the files Claude reads, the diff, and the inline comments all refer
      # to one commit even if the PR moves while this run waits or works. The action then restores some
      # configuration paths (.claude/, CLAUDE.md, .mcp.json, ...) from the base branch and keeps the PR's
      # versions in .claude-pr/.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Both ends of the change come from the event, so the diff stays the same if the base moves or the
      # PR is merged while this run waits. Claude gets no shell and reads these files instead. They are
      # written to a new directory outside the checkout, so a file or link the PR adds cannot redirect them.
      - name: Prepare the change for review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_INPUT: ${{ runner.temp }}/claude-review
        run: |
          mkdir "$REVIEW_INPUT"
          git log --format='%h %s' "$BASE_SHA..$HEAD_SHA" > "$REVIEW_INPUT/commits.txt"
          git diff "$BASE_SHA...$HEAD_SHA" > "$REVIEW_INPUT/pr.diff"
          gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json title,body --jq '.title + "\n\n" + .body' \
            > "$REVIEW_INPUT/description.md"
      - name: Review with Claude
        id: review
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          # Workload identity federation. These IDs are identifiers, not secrets; the rule only accepts
          # the subject repo:eeoos/airbob:pull_request. Do not add an API key: it would take precedence.
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          anthropic_workspace_id: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          github_token: ${{ github.token }}
          # Post inline comments directly: classifying them afterwards is a separate API call outside the budget.
          classify_inline_comments: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD: ${{ github.event.pull_request.head.sha }}

            이 PR을 docs/development/code-review.md 기준에 따라 리뷰하라.
            - 변경: ${{ runner.temp }}/claude-review/pr.diff
            - 커밋 목록: ${{ runner.temp }}/claude-review/commits.txt
            - PR 제목과 설명: ${{ runner.temp }}/claude-review/description.md
            - 작업 디렉터리는 HEAD 커밋이다. 다만 액션이 일부 설정 경로(.claude/, CLAUDE.md, .mcp.json 등)를 base 버전으로 되돌려 두었으니, 그런 경로의 PR 버전은 .claude-pr/<원래 경로>에서 읽어라.
            - 줄을 특정할 수 있는 지적은 인라인 댓글로 남기고, commit_id에는 HEAD를 넘겨라.
            - 전체 결과는 summary에 요약 댓글 본문으로 써라. 끝에 이번에 단 인라인 댓글의 URL 목록을 붙여라. 요약 댓글은 다음 단계가 게시한다.
          # Read-only file tools and inline comments only. No shell: git options such as --output write
          # files, and gh pr comment could edit or delete this account's other comments (the PR report).
          claude_args: >-
            --model claude-opus-5-5 --max-turns 30 --max-budget-usd 3
            --add-dir ${{ runner.temp }}/claude-review
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment"
            --disallowedTools Bash
            --json-schema '{"type":"object","properties":{"summary":{"type":"string"}},"required":["summary"],"additionalProperties":false}'
      - name: Post the summary comment
        if: ${{ steps.review.outputs.structured_output != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SUMMARY: ${{ fromJSON(steps.review.outputs.structured_output).summary }}
        run: |
          printf '<!-- airbob-claude-review -->\n%s\n\n<sub>리뷰한 커밋: %s · 실행: %s/%s · 기준: docs/development/code-review.md</sub>\n' \
            "$SUMMARY" "$HEAD_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/claude-review-comment.md"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/claude-review-comment.md"
