name: CD (Prod)

on:
  push:
    branches: [ main ]

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  build-app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_sha7: ${{ steps.meta.outputs.image_sha7 }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify immutable image contract
        run: bash infra/aws/tests/image-publication-test.sh

      - name: Set up JDK 21 (with Gradle cache)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build JAR with Gradle (skip tests)
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Compute image tag
        id: meta
        run: printf 'image_sha7=%s\n' "${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload application JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-jar-${{ github.sha }}
          path: build/libs/airbob.jar
          if-no-files-found: error
          retention-days: 1

  publish-oci-image:
    needs: build-app
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_sha7: ${{ needs.build-app.outputs.image_sha7 }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download application JAR
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: app-jar-${{ github.sha }}
          path: build/libs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read pinned application base
        id: image
        run: |
          printf 'app_base=%s\n' "$(jq -r '.app.buildArgs.APP_BASE_IMAGE' infra/aws/images/release.json)" >> "$GITHUB_OUTPUT"

      - name: Build and push OCI compatibility image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_BASE_IMAGE=${{ steps.image.outputs.app_base }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/airbob:${{ needs.build-app.outputs.image_sha7 }}
            ghcr.io/${{ github.repository_owner }}/airbob:latest

  publish-ecr-image:
    needs: build-app
    runs-on: ubuntu-latest
    environment: aws-image-publisher
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download application JAR
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: app-jar-${{ github.sha }}
          path: build/libs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502
        with:
          role-to-assume: ${{ vars.AWS_IMAGE_PUBLISHER_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: airbob-app-image-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64

      - name: Publish immutable app image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/app-image"
          infra/aws/scripts/publish-ecr-image.sh APP_IMAGE "$GITHUB_SHA" "$output_dir"
          infra/aws/scripts/assemble-image-release.sh app "$GITHUB_SHA" "$output_dir" "$RUNNER_TEMP/app-image-release.json"

      - name: Upload immutable app release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-image-release-${{ github.sha }}
          path: ${{ runner.temp }}/app-image-release.json
          if-no-files-found: error
          retention-days: 30

  deploy-oci:
    needs: publish-oci-image
    runs-on: self-hosted
    steps:
      - name: Login to GHCR
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: printf '%s' "$GHCR_PAT" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Deploy app and verify health
        env:
          IMAGE_SHA7: ${{ needs.publish-oci-image.outputs.image_sha7 }}
        run: |
          set -Eeuo pipefail
          cd "$HOME/airbob"

          COMPOSE=(docker compose --env-file .env.oci -f docker-compose.yml)
          IMAGE_REPO=ghcr.io/eeoos/airbob
          OLD_IMAGE_ID=$(docker inspect --format='{{.Image}}' airbob-app)

          wait_healthy() {
            local phase="$1"
            local status

            for attempt in {1..42}; do
              status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' airbob-app 2>/dev/null || echo missing)
              echo "$phase app health status: $status ($attempt/42)"

              case "$status" in
                healthy)
                  return 0
                  ;;
                unhealthy|exited|dead|missing)
                  return 1
                  ;;
              esac

              sleep 10
            done

            return 1
          }

          reload_nginx() {
            docker exec nginx nginx -t \
              && docker exec nginx nginx -s reload \
              && docker exec nginx wget -q --spider http://app:8080/actuator/health
          }

          rollback() {
            echo "Rolling back to image $OLD_IMAGE_ID" >&2
            docker image tag "$OLD_IMAGE_ID" "$IMAGE_REPO:latest" || return 1
            "${COMPOSE[@]}" up -d --no-deps --force-recreate --pull never app || return 1
            wait_healthy rollback || return 1
            reload_nginx
          }

          "${COMPOSE[@]}" config --quiet
          docker pull "$IMAGE_REPO:$IMAGE_SHA7"
          docker image tag "$IMAGE_REPO:$IMAGE_SHA7" "$IMAGE_REPO:latest"

          if ! "${COMPOSE[@]}" up -d --no-deps --force-recreate --pull never app \
            || ! wait_healthy deploy \
            || ! reload_nginx; then
            docker logs --tail 200 airbob-app || true
            rollback || echo "Rollback failed; manual recovery required" >&2
            exit 1
          fi
