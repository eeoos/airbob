name: CD (Prod)

on:
  push:
    branches: [ main ]

concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish-oci-image:
    needs: verify
    if: needs.verify.result == 'success' && needs.verify.outputs.oci_required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image_build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download application JAR
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: app-jar-${{ github.sha }}
          path: build/libs

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read pinned application base
        id: image
        run: |
          printf 'app_base=%s\n' "$(jq -r '.app.buildArgs.APP_BASE_IMAGE' infra/aws/images/release.json)" >> "$GITHUB_OUTPUT"

      - name: Build and push the tested application image
        id: image_build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: docker/app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            APP_BASE_IMAGE=${{ steps.image.outputs.app_base }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/airbob:${{ github.sha }}

  deploy-oci:
    needs: publish-oci-image
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout reviewed deployment assets
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Synchronize reviewed OCI deployment assets
        run: sh scripts/sync-oci-deployment-assets.sh "$GITHUB_WORKSPACE" "$HOME/airbob"

      - name: Deploy through the messaging and migration gates
        env:
          IMAGE_DIGEST: ${{ needs.publish-oci-image.outputs.digest }}
          HEALTH_ATTEMPTS: '120'
          HEALTH_DELAY_SECONDS: '10'
        run: |
          set -eu
          DEPLOY_DIR="$HOME/airbob" IMAGE_DIGEST="$IMAGE_DIGEST" \
            sh "$HOME/airbob/scripts/deploy-oci.sh"

      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io
