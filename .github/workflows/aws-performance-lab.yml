name: Operate AWS Performance Lab

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: Lab operation
        required: true
        type: choice
        options: [up, prepare, services, cdc, asg-probe, snapshot-create, snapshot-restore, snapshot-prepare, snapshot-retire, status, switch, down]
      run_id:
        description: Existing lab run id used by services, switch, or down
        required: false
        type: string
      mode:
        description: App capacity mode used by up
        required: false
        default: performance
        type: choice
        options: [performance, scaling]
      policy:
        description: Measurement policy used by up
        required: false
        default: integrated-smoke
        type: choice
        options: [isolated-read, integrated-smoke]
      dns_mode:
        description: Public DNS behavior; select cutover for cutover up/switch/down authorization
        required: false
        default: direct-only
        type: choice
        options: [direct-only, cutover]
      alb_ingress_cidr:
        description: Optional exact current runner IPv4 /32 for direct-only operations
        required: false
        type: string
      app_image_digest:
        description: Immutable ECR sha256 digest used by up
        required: false
        type: string
      dataset_release:
        description: Immutable dataset release used by up
        required: false
        type: string
      dataset_manifest_version_id:
        description: Audited S3 VersionId of the selected legacy, B preparation, service, or snapshot marker
        required: false
        type: string
      b_preparation_sha256:
        description: Reviewed content-addressed B preparation manifest SHA256; required for prepare
        required: false
        type: string
      bundle_commit:
        description: Full immutable runtime commit shared by app and service images
        required: false
        type: string
      bundle_manifest_version_id:
        description: Audited S3 VersionId of the service-bundle completion manifest
        required: false
        type: string
      database_bootstrap:
        description: RDS bootstrap source used by up
        required: false
        default: dump
        type: choice
        options: [dump, snapshot]
      rds_snapshot_identifier:
        description: Dataset-bound manual RDS snapshot required by snapshot bootstrap
        required: false
        type: string
      rds_snapshot_source_run_id:
        description: Exact dump-mode Lab run that produced the promoted snapshot
        required: false
        type: string
      rds_snapshot_source_resource_id:
        description: Exact source RDS resource ID recorded by snapshot promotion
        required: false
        type: string
      load_generator_enabled:
        description: Explicit qualification override; false avoids the c6i.xlarge load generator
        required: false
        default: false
        type: boolean
      request_target:
        description: Scaling ALB requests-per-target-per-minute target
        required: false
        type: string
      target:
        description: DNS target used by switch
        required: false
        default: oci
        type: choice
        options: [oci, aws]
      ttl_hours:
        description: Ephemeral resource TTL; initial dump and snapshot qualification require at least 6 hours
        required: false
        default: '6'
        type: string
      approved_execution_deadline_epoch:
        description: Approved common UTC epoch deadline for every B run and continuation; never reset per run
        required: false
        type: string
      keep_on_failure:
        description: Preserve a failed pre-cutover lab for diagnosis
        required: false
        default: false
        type: boolean
      expected_execution_commit:
        description: Reviewed full main commit SHA; required for every manual mutation
        required: false
        type: string
      b_operation:
        description: Closed B service, source R4 CDC, ASG probe, or snapshot operation JSON
        required: false
        type: string
      force:
        description: Force expired down at or after the declared expiry
        required: false
        default: false
        type: boolean
concurrency:
  group: aws-performance-lab
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'schedule' || inputs.action == 'switch' || inputs.dns_mode == 'cutover') && 'aws-performance-lab-cutover' || 'aws-performance-lab' }}
    timeout-minutes: ${{ (inputs.action == 'up' || inputs.action == 'prepare' || inputs.action == 'services' || inputs.action == 'cdc' || inputs.action == 'asg-probe' || startsWith(inputs.action, 'snapshot-')) && 359 || 120 }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Record workflow deadline
        env:
          ACTION: ${{ inputs.action }}
          DATABASE_BOOTSTRAP: ${{ inputs.database_bootstrap }}
        run: |
          set -euo pipefail
          WORKFLOW_INITIALIZATION_RESERVE_SECONDS=120
          workflow_ceiling_seconds=7200
          if [[ "$ACTION" == up || "$ACTION" == prepare || "$ACTION" == services || "$ACTION" == cdc || "$ACTION" == asg-probe || "$ACTION" == snapshot-* ]]; then
            workflow_ceiling_seconds=21540
          fi
          printf 'AIRBOB_WORKFLOW_DEADLINE_EPOCH=%s\n' \
            "$(( $(date -u +%s) + workflow_ceiling_seconds - WORKFLOW_INITIALIZATION_RESERVE_SECONDS ))" \
            >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify reviewed main commit and closed operation inputs
        env:
          AIRBOB_EVENT_NAME: ${{ github.event_name }}
          AIRBOB_ACTION: ${{ inputs.action }}
          AIRBOB_EXPECTED_EXECUTION_COMMIT: ${{ inputs.expected_execution_commit }}
          AIRBOB_B_OPERATION: ${{ inputs.b_operation }}
          AIRBOB_DNS_MODE: ${{ inputs.dns_mode }}
          AIRBOB_MODE: ${{ inputs.mode }}
          AIRBOB_POLICY: ${{ inputs.policy }}
          AIRBOB_DATABASE_BOOTSTRAP: ${{ inputs.database_bootstrap }}
          AIRBOB_LOAD_GENERATOR_ENABLED: ${{ inputs.load_generator_enabled }}
          AIRBOB_APPROVED_EXECUTION_DEADLINE_EPOCH: ${{ inputs.approved_execution_deadline_epoch }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json, os, re, subprocess, time
          def require(value, message):
              if not value:
                  raise SystemExit(message)
          def exact_pairs(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result, "B operation JSON contains duplicate keys")
                  result[key] = value
              return result
          head = subprocess.check_output(["git", "rev-parse", "--verify", "HEAD^{commit}"], text=True).strip()
          sha = os.environ["GITHUB_SHA"]
          require(os.environ["GITHUB_REF"] == "refs/heads/main", "Only the protected main deployment branch is allowed")
          require(re.fullmatch(r"[0-9a-f]{40}", sha) and head == sha, "Checked-out commit differs from the dispatch commit")
          event = os.environ["AIRBOB_EVENT_NAME"]
          if event == "schedule":
              raise SystemExit(0)
          require(event == "workflow_dispatch", "Unsupported workflow event")
          action = os.environ["AIRBOB_ACTION"]
          require(action in {"up", "prepare", "services", "cdc", "asg-probe", "snapshot-create", "snapshot-restore", "snapshot-prepare", "snapshot-retire", "status", "switch", "down"}, "Unsupported operation")
          expected = os.environ["AIRBOB_EXPECTED_EXECUTION_COMMIT"]
          if action != "status" or expected:
              require(re.fullmatch(r"[0-9a-f]{40}", expected) and expected == sha, "Reviewed execution commit must equal the checked-out main commit")
          try:
              operation = json.loads(os.environ.get("AIRBOB_B_OPERATION") or "{}", object_pairs_hook=exact_pairs)
          except (ValueError, TypeError):
              raise SystemExit("B operation must be valid JSON")
          require(isinstance(operation, dict), "B operation must be an object")
          env = {}
          if action in {"prepare", "services", "cdc", "asg-probe", "snapshot-create", "snapshot-restore", "snapshot-prepare", "snapshot-retire"}:
              deadline = os.environ.get("AIRBOB_APPROVED_EXECUTION_DEADLINE_EPOCH", "")
              require(re.fullmatch(r"[1-9][0-9]{9}", deadline), "B operations require the approved common UTC execution deadline")
              remaining = int(deadline) - int(time.time())
              require(remaining > 0, "The approved B execution deadline has expired")
              if action in {"prepare", "snapshot-restore"}:
                  require(remaining >= 21600, "A new B run requires at least six hours before the approved common deadline")
              require(os.environ["AIRBOB_DNS_MODE"] == "direct-only", "B operations require direct-only DNS")
              require(os.environ["AIRBOB_MODE"] == "performance", "B operations require performance mode")
              require(os.environ["AIRBOB_LOAD_GENERATOR_ENABLED"] == "false", "B operations must keep the load generator disabled")
          if action == "services":
              require(operation.get("stage") in {"dependencies", "native-restore", "native-snapshot-restore", "bootstrap", "application", "snapshot-verify"}, "B service stage is invalid")
              if operation["stage"] in {"native-restore", "native-snapshot-restore"}:
                  import sys
                  sys.path.insert(0, "infra/aws/scripts")
                  from growth_b_search_controller import validate_operation
                  validate_operation(operation)
                  require(operation["executionCommit"] == sha, "Native search must identify this reviewed main commit")
                  source_mode = "snapshot" if operation["stage"] == "native-snapshot-restore" else "dump"
                  require(os.environ["AIRBOB_DATABASE_BOOTSTRAP"] == source_mode, "Native search must retain the declared database source")
                  require(os.environ["AIRBOB_POLICY"] == "isolated-read", "Native search requires isolated-read controller mode")
                  env = {"B_SERVICE_RELEASE": operation["serviceRelease"], "B_SERVICE_STAGE": operation["stage"],
                      "B_SERVICE_SHA256": operation["manifest"]["sha256"],
                      "B_NATIVE_OPERATION_JSON": json.dumps(operation, sort_keys=True, separators=(",", ":"))}
              elif operation["stage"] == "snapshot-verify":
                  import sys
                  sys.path.insert(0, "infra/aws/scripts")
                  from growth_b_snapshot_service_verify import validate_operation
                  validate_operation(operation)
                  require(operation["executionCommit"] == sha, "Snapshot target service operation must identify this reviewed main commit")
                  require(os.environ["AIRBOB_DATABASE_BOOTSTRAP"] == "snapshot", "Snapshot target service verification requires snapshot mode")
                  env = {"B_SERVICE_RELEASE": operation["serviceRelease"], "B_SERVICE_STAGE": "snapshot-verify",
                      "B_SNAPSHOT_SERVICE_OPERATION_JSON": json.dumps(operation, sort_keys=True, separators=(",", ":"))}
              else:
                  required = {"serviceRelease", "serviceManifestSha256", "stage"}
                  if operation["stage"] == "application":
                      required |= {"readinessVersionId", "readinessSha256"}
                  require(set(operation) == required, "B service operation keys differ from the selected stage")
                  require(isinstance(operation["serviceRelease"], str) and re.fullmatch(r"[a-z0-9][a-z0-9-]{2,47}", operation["serviceRelease"]), "B service release is invalid")
                  require(isinstance(operation["serviceManifestSha256"], str) and re.fullmatch(r"[0-9a-f]{64}", operation["serviceManifestSha256"]), "B service manifest SHA is invalid")
                  env = {"B_SERVICE_RELEASE": operation["serviceRelease"], "B_SERVICE_SHA256": operation["serviceManifestSha256"], "B_SERVICE_STAGE": operation["stage"]}
                  if operation["stage"] == "application":
                      require(isinstance(operation["readinessVersionId"], str) and re.fullmatch(r"[A-Za-z0-9._~+/=-]+", operation["readinessVersionId"]) and operation["readinessVersionId"] not in {"null", "None"}, "B readiness VersionId is invalid")
                      require(isinstance(operation["readinessSha256"], str) and re.fullmatch(r"[0-9a-f]{64}", operation["readinessSha256"]), "B readiness SHA is invalid")
                      env.update(B_READINESS_VERSION_ID=operation["readinessVersionId"], B_READINESS_SHA256=operation["readinessSha256"])
          elif action == "cdc":
              import sys
              sys.path.insert(0, "infra/aws/scripts")
              from growth_b_cdc_supervisor import validate_operation
              validate_operation(operation)
              require(operation["executionCommit"] == sha, "Source R4 operation must identify this reviewed main commit")
              require(os.environ["AIRBOB_POLICY"] == "isolated-read", "Source R4 continuation requires isolated-read controller mode")
              env = {"B_CDC_OPERATION_JSON": json.dumps(operation, sort_keys=True, separators=(",", ":"))}
          elif action == "asg-probe":
              required = {"operationId", "serviceRelease", "serviceManifestSha256", "readinessVersionId", "readinessSha256", "detailPath"}
              require(required <= set(operation) <= required | {"resume"}, "B ASG probe operation keys differ")
              for key in ("operationId", "serviceRelease"):
                  require(isinstance(operation[key], str) and re.fullmatch(r"[a-z0-9][a-z0-9-]{2,47}", operation[key]) and "--" not in operation[key] and not operation[key].endswith("-"), "B ASG probe coordinates are invalid")
              for key in ("serviceManifestSha256", "readinessSha256"):
                  require(isinstance(operation[key], str) and re.fullmatch(r"[0-9a-f]{64}", operation[key]), "B ASG proof SHA is invalid")
              require(isinstance(operation["readinessVersionId"], str) and re.fullmatch(r"[A-Za-z0-9._~+/=-]{1,1024}", operation["readinessVersionId"]) and operation["readinessVersionId"] not in {"null", "None"}, "B ASG readiness version is invalid")
              require(isinstance(operation["detailPath"], str) and re.fullmatch(r"/api/v1/accommodations/[1-9][0-9]{0,18}", operation["detailPath"]), "B ASG probe permits one exact public detail GET")
              if "resume" in operation:
                  require(isinstance(operation["resume"], dict) and set(operation["resume"]) == {"configuration", "receipt"}, "B ASG resume requires exact configuration and receipt")
                  for key, suffix in (("configuration", "configuration.json"), ("receipt", "asg-probe.json")):
                      item = operation["resume"][key]
                      require(isinstance(item, dict) and set(item) == {"key", "versionId", "sha256", "bytes"}, "B ASG resume reference fields differ")
                      require(isinstance(item["key"], str) and re.fullmatch(r"data-bootstrap/lab-[a-z0-9][a-z0-9-]{0,27}/asg-probe/" + re.escape(operation["operationId"]) + r"-[1-9][0-9]*/" + re.escape(suffix), item["key"]), "B ASG resume path is invalid")
                      require(isinstance(item["versionId"], str) and re.fullmatch(r"[A-Za-z0-9._~+/=-]{1,1024}", item["versionId"]) and item["versionId"] not in {"null", "None"}, "B ASG resume version is invalid")
                      require(isinstance(item["sha256"], str) and re.fullmatch(r"[0-9a-f]{64}", item["sha256"]) and type(item["bytes"]) is int and 0 < item["bytes"] <= 20971520, "B ASG resume metadata is invalid")
              env = {"B_ASG_PROBE_OPERATION_JSON": json.dumps(operation, sort_keys=True, separators=(",", ":"))}
          elif action == "snapshot-restore":
              require({"provenanceSha256"} <= set(operation) <= {"provenanceSha256", "provenanceKey"}, "B snapshot operation must contain provenanceSha256 and optional exact provenanceKey")
              require(isinstance(operation["provenanceSha256"], str) and re.fullmatch(r"[0-9a-f]{64}", operation["provenanceSha256"]), "B snapshot provenance SHA is invalid")
              require(os.environ["AIRBOB_DATABASE_BOOTSTRAP"] == "snapshot" and os.environ["AIRBOB_POLICY"] == "isolated-read", "B snapshot target creation requires isolated-read snapshot mode")
              env["B_SNAPSHOT_PROVENANCE_SHA256"] = operation["provenanceSha256"]
              if "provenanceKey" in operation:
                  require(isinstance(operation["provenanceKey"], str) and re.fullmatch(r"data-bootstrap/lab-[a-z0-9][a-z0-9-]{0,27}/global-growth-b-[0-9a-f]{16}-snapshot/[a-z0-9][a-z0-9-]{2,47}/snapshot-provenance[.]json", operation["provenanceKey"]), "B source-host provenance key is invalid")
                  env["B_SNAPSHOT_PROVENANCE_KEY"] = operation["provenanceKey"]
          elif action in {"snapshot-create", "snapshot-prepare", "snapshot-retire"}:
              require(set(operation) == {"operationId", "manifestSha256"}, "B host operation keys differ")
              require(isinstance(operation["operationId"], str) and re.fullmatch(r"[a-z0-9][a-z0-9-]{2,47}", operation["operationId"]) and "--" not in operation["operationId"] and not operation["operationId"].endswith("-"), "B snapshot operationId is invalid")
              require(isinstance(operation["manifestSha256"], str) and re.fullmatch(r"[0-9a-f]{64}", operation["manifestSha256"]), "B snapshot manifest SHA is invalid")
              require(os.environ["AIRBOB_POLICY"] == "isolated-read", "B host operations require isolated-read controller mode")
              env = {"B_SNAPSHOT_OPERATION_ID": operation["operationId"], "B_SNAPSHOT_OPERATION_SHA256": operation["manifestSha256"]}
          else:
              require(not operation, "B operation input is not accepted for this action")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for key, value in sorted(env.items()):
                  output.write(key + "=" + value + "\n")
          PYCODE

      - name: Set up Terraform 1.15.5
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.5
          terraform_wrapper: false

      - name: Install pinned AWS CLI
        run: |
          set -euo pipefail
          source infra/aws/toolchain.env
          aws_cli_archive="$RUNNER_TEMP/awscli-exe-linux-x86_64-${AIRBOB_AWS_CLI_VERSION}.zip"
          aws_cli_extract="$RUNNER_TEMP/aws-cli-installer"
          aws_cli_install="$RUNNER_TEMP/aws-cli"
          aws_cli_bin="$RUNNER_TEMP/aws-cli-bin"
          curl --fail --silent --show-error --location --retry 5 \
            --output "$aws_cli_archive" \
            "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${AIRBOB_AWS_CLI_VERSION}.zip"
          printf '%s  %s\n' "$AIRBOB_AWS_CLI_LINUX_X86_64_SHA256" "$aws_cli_archive" \
            | sha256sum --check --status
          unzip -q "$aws_cli_archive" -d "$aws_cli_extract"
          "$aws_cli_extract/aws/install" --install-dir "$aws_cli_install" --bin-dir "$aws_cli_bin"
          aws_cli_version_output=$("$aws_cli_bin/aws" --version 2>&1)
          aws_cli_version=${aws_cli_version_output#aws-cli/}
          aws_cli_version=${aws_cli_version%% *}
          [[ "$aws_cli_version" == "$AIRBOB_AWS_CLI_VERSION" ]]
          printf '%s\n' "$aws_cli_bin" >> "$GITHUB_PATH"

      - name: Configure short-lived AWS credentials
        id: aws_credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ (github.event_name == 'schedule' || inputs.action == 'switch' || inputs.dns_mode == 'cutover') && vars.AWS_LAB_CUTOVER_OPERATOR_ROLE_ARN || vars.AWS_LAB_OPERATOR_ROLE_ARN }}
          aws-region: ap-northeast-2
          role-session-name: airbob-lab-${{ github.run_id }}
          role-duration-seconds: ${{ (inputs.action == 'up' || inputs.action == 'prepare' || inputs.action == 'services' || inputs.action == 'cdc' || inputs.action == 'asg-probe' || startsWith(inputs.action, 'snapshot-')) && 21600 || 7200 }}
          output-credentials: true

      - name: Verify operator credential scope
        env:
          EXPECTED_ROLE_NAME: ${{ (github.event_name == 'schedule' || inputs.action == 'switch' || inputs.dns_mode == 'cutover') && 'airbob-lab-cutover-operator' || 'airbob-lab-operator' }}
        run: |
          set -euo pipefail
          [[ "$(command -v aws)" == "$RUNNER_TEMP/aws-cli-bin/aws" ]] || {
            echo 'AWS CLI path does not resolve to the pinned runner installation' >&2
            exit 1
          }
          caller_arn=$(aws sts get-caller-identity --query Arn --output text --no-cli-pager)
          [[ "$caller_arn" =~ ^arn:aws:sts::942632789808:assumed-role/${EXPECTED_ROLE_NAME}/[A-Za-z0-9+=,.@_-]+$ ]] || {
            echo 'AWS credentials do not match the required Lab operator scope' >&2
            exit 1
          }

      - name: Resolve direct-only operator ingress /32
        if: github.event_name == 'workflow_dispatch' && (inputs.action == 'up' || inputs.action == 'prepare' || inputs.action == 'services' || inputs.action == 'snapshot-restore') && inputs.dns_mode == 'direct-only'
        env:
          REQUESTED_CIDR: ${{ inputs.alb_ingress_cidr || vars.AWS_LAB_OPERATOR_CIDR }}
        run: |
          set -euo pipefail
          live_address=$(curl --fail --silent --show-error --max-time 10 https://checkip.amazonaws.com)
          if [[ -n "$REQUESTED_CIDR" ]]; then
            [[ "$REQUESTED_CIDR" =~ ^([^/]+)/32$ ]] || { echo 'operator CIDR must be one /32' >&2; exit 1; }
            requested_address=${BASH_REMATCH[1]}
            [[ "$requested_address" == "$live_address" ]] || {
              echo 'operator CIDR override does not match this runner public address' >&2
              exit 1
            }
          fi
          address=$live_address
          [[ "$address" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'operator address is not IPv4' >&2; exit 1; }
          IFS=. read -r first second third fourth <<< "$address"
          for octet in "$first" "$second" "$third" "$fourth"; do
            [[ "$octet" == 0 || "$octet" != 0* ]] || { echo 'operator address is not canonical' >&2; exit 1; }
            ((10#$octet <= 255)) || { echo 'operator address octet is invalid' >&2; exit 1; }
          done
          if ((first == 0 || first == 10 || first == 127 || first >= 224)) ||
             ((first == 100 && second >= 64 && second <= 127)) ||
             ((first == 169 && second == 254)) ||
             ((first == 172 && second >= 16 && second <= 31)) ||
             ((first == 192 && (
               (second == 0 && (third == 0 || third == 2)) ||
               (second == 88 && third == 99) ||
               second == 168
             ))) ||
             ((first == 198 && (second == 18 || second == 19 || (second == 51 && third == 100)))) ||
             ((first == 203 && second == 0 && third == 113)); then
            echo 'operator address is not public IPv4' >&2
            exit 1
          fi
          printf 'ALB_INGRESS_CIDR=%s/32\n' "$address" >> "$GITHUB_ENV"

      - name: Run shared lab operator
        if: github.event_name == 'workflow_dispatch'
        env:
          AIRBOB_ACTION: ${{ inputs.action }}
          AWS_REGION: ap-northeast-2
          MODE: ${{ inputs.mode }}
          POLICY: ${{ inputs.policy }}
          DNS_MODE: ${{ inputs.dns_mode }}
          IMAGE_DIGEST: ${{ inputs.app_image_digest }}
          DATASET_RELEASE: ${{ inputs.dataset_release }}
          DATASET_MANIFEST_VERSION_ID: ${{ inputs.dataset_manifest_version_id }}
          B_PREPARATION_SHA256: ${{ inputs.b_preparation_sha256 }}
          BUNDLE_MANIFEST_VERSION_ID: ${{ inputs.bundle_manifest_version_id }}
          REQUEST_TARGET: ${{ inputs.request_target }}
          TARGET: ${{ inputs.target }}
          TTL_HOURS: ${{ inputs.ttl_hours }}
          APPROVED_EXECUTION_DEADLINE_EPOCH: ${{ inputs.approved_execution_deadline_epoch }}
          CDC_EVIDENCE_DIR: ${{ runner.temp }}/airbob-b-cdc
          NATIVE_SEARCH_EVIDENCE_DIR: ${{ runner.temp }}/airbob-b-native-search
          SNAPSHOT_SERVICE_EVIDENCE_DIR: ${{ runner.temp }}/airbob-b-snapshot-service
          ASG_PROBE_EVIDENCE_DIR: ${{ runner.temp }}/airbob-b-asg-probe
          KEEP_ON_FAILURE: ${{ inputs.keep_on_failure }}
          FORCE: ${{ inputs.force }}
          AMI_ID: ${{ vars.AWS_LAB_AMI_ID }}
          OCI_ORIGIN_IPV4: ${{ vars.OCI_ORIGIN_IPV4 }}
          RDS_ENGINE_VERSION: ${{ (inputs.action == 'prepare' || inputs.action == 'services' || inputs.action == 'cdc' || inputs.action == 'asg-probe' || startsWith(inputs.action, 'snapshot-')) && '8.4.11' || vars.AWS_LAB_RDS_ENGINE_VERSION }}
          CACHE_ENABLED: ${{ (inputs.action == 'prepare' || inputs.action == 'snapshot-restore') && 'false' || vars.AWS_LAB_CACHE_ENABLED || 'true' }}
          LOAD_GENERATOR_ENABLED: ${{ inputs.load_generator_enabled }}
          BUNDLE_COMMIT: ${{ inputs.bundle_commit }}
          DATABASE_BOOTSTRAP: ${{ inputs.database_bootstrap }}
          RDS_SNAPSHOT_IDENTIFIER: ${{ inputs.rds_snapshot_identifier }}
          RDS_SNAPSHOT_SOURCE_RUN_ID: ${{ inputs.rds_snapshot_source_run_id }}
          RDS_SNAPSHOT_SOURCE_RESOURCE_ID: ${{ inputs.rds_snapshot_source_resource_id }}
          AIRBOB_AWS_CREDENTIAL_EXPIRATION: ${{ fromJSON(steps.aws_credentials.outputs.aws-expiration) }}
          AWS_LAB_OPERATOR_SCOPE: ${{ (inputs.action == 'switch' || inputs.dns_mode == 'cutover') && 'cutover' || 'direct' }}
          RUN_ID: ${{ (inputs.action == 'up' || inputs.action == 'prepare' || inputs.action == 'snapshot-restore') && format('lab-{0}-{1}', github.run_id, github.run_attempt) || inputs.run_id }}
        run: infra/aws/scripts/aws-lab.sh "$AIRBOB_ACTION"

      - name: Preserve closed B source R4 recovery evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.action == 'cdc'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: global-b-cdc-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/airbob-b-cdc/**/public/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve closed snapshot target service evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.action == 'services' && env.B_SERVICE_STAGE == 'snapshot-verify'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: global-b-snapshot-service-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/airbob-b-snapshot-service/**/public/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve B native search evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.action == 'services' && contains(fromJSON('["native-restore", "native-snapshot-restore"]'), env.B_SERVICE_STAGE)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: global-b-native-search-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/airbob-b-native-search
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve B ASG probe recovery evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.action == 'asg-probe'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: global-b-asg-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/airbob-b-asg-probe
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up an expired lab after grace
        if: github.event_name == 'schedule'
        env:
          AWS_REGION: ap-northeast-2
          OCI_ORIGIN_IPV4: ${{ vars.OCI_ORIGIN_IPV4 }}
          AWS_LAB_OPERATOR_SCOPE: cutover
        run: infra/aws/scripts/cleanup-expired-lab.sh
