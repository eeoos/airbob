x-airbob-image-contracts:
  prometheus-jmx-exporter:
    version: "1.6.0"
    agent-path: /opt/jmx/jmx_prometheus_javaagent.jar

services:
  kafka:
    image: ${KAFKA_IMAGE:?KAFKA_IMAGE is required}
    platform: linux/amd64
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,VPC://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,VPC://kafka.lab.airbob.internal:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,VPC:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: airbob-performance-lab
      KAFKA_HEAP_OPTS: -Xms1g -Xmx1g
      KAFKA_OPTS: >-
        -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=7071:/opt/jmx/kafka.yml
    ports:
      - "9092:9092"
      - "7071:7071"
    volumes:
      - kafka-data:/var/lib/kafka/data
      - ./jmx-exporter.yml:/opt/jmx/kafka.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 1536M
    memswap_limit: 1536M
    restart: unless-stopped

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:?NODE_EXPORTER_IMAGE is required}
    platform: linux/amd64
    pid: host
    command: ["--path.rootfs=/host"]
    ports: ["9100:9100"]
    volumes: ["/:/host:ro"]
    mem_limit: 128M
    memswap_limit: 128M
    restart: unless-stopped

volumes:
  kafka-data:
