x-airbob-image-contracts:
  prometheus-jmx-exporter:
    version: "1.6.0"
    agent-path: /opt/jmx/jmx_prometheus_javaagent.jar

services:
  debezium:
    image: ${DEBEZIUM_IMAGE:?DEBEZIUM_IMAGE is required}
    platform: linux/amd64
    command:
      - /opt/kafka/bin/connect-distributed.sh
      - /opt/kafka/config/connect-distributed.aws.properties
    environment:
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
      KAFKA_OPTS: >-
        -javaagent:/opt/jmx/jmx_prometheus_javaagent.jar=9404:/opt/jmx/debezium.yml
    ports:
      - "127.0.0.1:8083:8083"
      - "9404:9404"
    volumes:
      - ./connect-distributed.aws.properties:/opt/kafka/config/connect-distributed.aws.properties:ro
      - ./jmx-exporter.yml:/opt/jmx/debezium.yml:ro
    healthcheck:
      test: ["CMD", "/bin/bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8083"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 768M
    memswap_limit: 768M
    restart: unless-stopped

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:?NODE_EXPORTER_IMAGE is required}
    platform: linux/amd64
    pid: host
    command: ["--path.rootfs=/host"]
    ports: ["9100:9100"]
    volumes: ["/:/host:ro"]
    mem_limit: 128M
    memswap_limit: 128M
    restart: unless-stopped
