services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:?PROMETHEUS_IMAGE is required}
    platform: linux/amd64
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ../../../../monitoring/prometheus/prometheus.aws.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=5GB
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512M
    memswap_limit: 512M
    restart: unless-stopped

  grafana:
    image: ${GRAFANA_IMAGE:?GRAFANA_IMAGE is required}
    platform: linux/amd64
    env_file:
      - path: ${MONITORING_ENV_FILE:?MONITORING_ENV_FILE is required}
        required: true
        format: raw
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ -z "$${GRAFANA_ADMIN_PASSWORD:-}" ]; then
          echo "GRAFANA_ADMIN_PASSWORD must be set for AWS Grafana" >&2
          exit 1
        fi
        export GF_SECURITY_ADMIN_PASSWORD="$${GRAFANA_ADMIN_PASSWORD}"
        exec /run.sh
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
      GRAFANA_DASHBOARD_ALLOW_UI_UPDATES: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../../../monitoring/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ../../../../monitoring/grafana/provisioning/datasources/cloudwatch.aws.yml:/etc/grafana/provisioning/datasources/cloudwatch.yml:ro
      - ../../../../monitoring/grafana/provisioning/dashboards/airbob.yml:/etc/grafana/provisioning/dashboards/airbob.yml:ro
      - ../../../../monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 384M
    memswap_limit: 384M
    restart: unless-stopped

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:?NODE_EXPORTER_IMAGE is required}
    platform: linux/amd64
    pid: host
    command: ["--path.rootfs=/host"]
    ports: ["9100:9100"]
    volumes: ["/:/host:ro"]
    mem_limit: 128M
    memswap_limit: 128M
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
