services:
  elasticsearch:
    image: ${ELASTICSEARCH_IMAGE:?ELASTICSEARCH_IMAGE is required}
    platform: linux/amd64
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports: ["9200:9200"]
    volumes: ["elasticsearch-data:/usr/share/elasticsearch/data"]
    mem_limit: 2G
    memswap_limit: 2G
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    restart: unless-stopped

  elasticsearch-exporter:
    image: ${ELASTICSEARCH_EXPORTER_IMAGE:?ELASTICSEARCH_EXPORTER_IMAGE is required}
    platform: linux/amd64
    command: ["--es.uri=http://elasticsearch:9200"]
    ports: ["9114:9114"]
    mem_limit: 128M
    memswap_limit: 128M
    restart: unless-stopped

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:?NODE_EXPORTER_IMAGE is required}
    platform: linux/amd64
    pid: host
    command: ["--path.rootfs=/host"]
    ports: ["9100:9100"]
    volumes: ["/:/host:ro"]
    mem_limit: 128M
    memswap_limit: 128M
    restart: unless-stopped

volumes:
  elasticsearch-data:

x-airbob-host-contracts:
  elasticsearch:
    vm.max_map_count: 1048576
