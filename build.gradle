plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.kro'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	// Resolve only the library used by the offline Python/Java credential contract.
	growthBContractTestRuntime {
		canBeConsumed = false
		canBeResolved = true
		transitive = false
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom "io.awspring.cloud:spring-cloud-aws-dependencies:3.1.1"
	}
}

dependencies {
	growthBContractTestRuntime 'org.mindrot:jbcrypt:0.4'

	// Spring Web
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

	//Spring Validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Spring Data JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	//해싱
	implementation 'org.mindrot:jbcrypt:0.4'

	//httpclient
	implementation 'org.apache.httpcomponents.client5:httpclient5'

	//elasticsearch
	implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
	implementation 'co.elastic.clients:elasticsearch-java'

	// retry
	implementation 'org.springframework.retry:spring-retry'

	// aop
	implementation 'org.springframework.boot:spring-boot-starter-aop'

	//Redis
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	//Redisson
	implementation 'org.redisson:redisson:3.28.0'

	// Caffeine (공통 코드 로컬 캐시 + TTL)
	implementation 'com.github.ben-manes.caffeine:caffeine'

	// Flyway
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// MySQL JDBC 드라이버
	compileOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'com.mysql:mysql-connector-j'

	// 로컬 SQL 진단 전용. 운영 bootJar에는 포함하지 않는다.
	compileOnly 'p6spy:p6spy:3.9.1'
	developmentOnly 'p6spy:p6spy:3.9.1'
	testImplementation 'p6spy:p6spy:3.9.1'

	// Kafka
	implementation 'org.springframework.kafka:spring-kafka'

	// Spring Cloud AWS
	implementation "io.awspring.cloud:spring-cloud-aws-starter-s3"

	// Commons Lang
	implementation 'org.apache.commons:commons-lang3:3.18.0'

	// Coordinate-based IANA time zone resolution
	implementation 'net.iakovlev:timeshape:2026b.29'

	// Jackson CSV
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-csv'

	// Json
	implementation 'org.json:json:20250107'

	// Actuator
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// Prometheus
	implementation 'io.micrometer:micrometer-registry-prometheus'

	// 테스트
	testImplementation 'org.springframework.kafka:spring-kafka-test'

	//query dsl
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
	annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
	annotationProcessor "jakarta.annotation:jakarta.annotation-api"
	annotationProcessor "jakarta.persistence:jakarta.persistence-api"

	// 테스트
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'com.networknt:json-schema-validator:1.5.9'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	//test container
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation("org.testcontainers:junit-jupiter")
	testImplementation("org.testcontainers:mysql")
	testImplementation("org.testcontainers:elasticsearch")
	testImplementation("org.testcontainers:testcontainers")
}


tasks.register('prepareGrowthBContractTestRuntime', Sync) {
	group = 'verification'
	description = 'Prepare BCrypt for the offline Global B credential contract tests.'
	from configurations.growthBContractTestRuntime
	into layout.buildDirectory.dir('growth-b-contract-test-runtime')
}


tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'user.timezone', 'UTC'
	// The same tests run in isolation through the OpenAPI tasks below.
	exclude '**/apidocs/**'
}

tasks.named('bootJar') {
	archiveFileName = "airbob.jar"
}

// Generate with real MVC controllers and mocked services, without application infrastructure.
tasks.register('generateOpenApi', Test) {
	group = 'documentation'
	description = 'Generate and validate API contracts in build/openapi without changing source files.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	include '**/apidocs/**'
	useJUnitPlatform()
	systemProperty 'user.timezone', 'UTC'
	systemProperty 'airbob.openapi.output', layout.buildDirectory.dir('openapi').get().asFile.absolutePath
	outputs.dir layout.buildDirectory.dir('openapi')
}

tasks.register('updateOpenApi', Sync) {
	group = 'documentation'
	description = 'Explicitly replace the versioned OpenAPI snapshots with validated generated contracts.'
	dependsOn tasks.named('generateOpenApi')
	from layout.buildDirectory.dir('openapi')
	into layout.projectDirectory.dir('docs/api/openapi')
}

tasks.register('verifyOpenApi') {
	mustRunAfter tasks.named('updateOpenApi')
	group = 'verification'
	description = 'Reject stale, missing, or unexpected versioned OpenAPI contracts.'
	dependsOn tasks.named('generateOpenApi')
	inputs.dir layout.projectDirectory.dir('docs/api/openapi')
	inputs.dir layout.buildDirectory.dir('openapi')
	doLast {
		def generated = layout.buildDirectory.dir('openapi').get().asFile
		def versioned = layout.projectDirectory.dir('docs/api/openapi').asFile
		def names = generated.listFiles().findAll { it.isFile() }.collect { it.name }.toSet()
		def savedNames = versioned.listFiles()?.findAll { it.isFile() }?.collect { it.name }?.toSet() ?: [] as Set
		if (names.isEmpty() || names != savedNames || names.any {
			!java.util.Arrays.equals(new File(generated, it).bytes, new File(versioned, it).bytes)
		}) {
			throw new GradleException('OpenAPI snapshots are stale. Run ./gradlew updateOpenApi and commit docs/api/openapi/.')
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('verifyOpenApi')
}
