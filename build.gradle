import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
	id 'base'
	alias(libs.plugins.spring.boot) apply false
	alias(libs.plugins.spring.dependency.management) apply false
	alias(libs.plugins.spotless) apply false
}

allprojects {
	group = 'kr.kro'
	version = '0.0.1-SNAPSHOT'

	repositories {
		mavenCentral()
	}
}

// Only leaf modules (core:core-api, ...) are Java projects; group folders such as ':core' are not.
configure(subprojects.findAll { it.subprojects.isEmpty() }) {
	apply plugin: 'java-library'
	apply plugin: 'io.spring.dependency-management'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	dependencyManagement {
		imports {
			mavenBom SpringBootPlugin.BOM_COORDINATES
		}
	}

	tasks.withType(Test).configureEach {
		useJUnitPlatform()
		systemProperty 'user.timezone', 'UTC'
	}

	// Naver coding convention. spotlessCheck runs in check, so ./gradlew build fails on unformatted code;
	// ./gradlew spotlessApply fixes it. See docs/development/coding-convention.md.
	apply plugin: 'com.diffplug.spotless'
	spotless {
		java {
			// Hand-written sources only; generated QueryDSL Q-classes live under build/.
			target 'src/*/java/**/*.java'
			removeUnusedImports()
			// Trailing dots keep package boundaries: 'java' alone would also match javassist.
			importOrder('\\#', 'java.', 'javax.', 'org.', 'net.', 'com.', '')
			// The Naver convention allows wildcards only in static imports; forbidWildcardImports() rejects both.
			forbidRegex('Non-static wildcard import', '(?m)^import (?!static\\s)[\\w.]+\\.\\*;',
				'Import each class by name; only static imports may use *')
			// Tests assert with AssertJ. A lint here covers every module's tests, unlike an ArchUnit rule in core-api.
			// JUnit 4 and Hamcrest are on the test classpath through Testcontainers and spring-boot-starter-test;
			// org.hamcrest.Matchers stays allowed for MockMvc jsonPath matchers.
			forbidRegex('Non-AssertJ assertions',
				'org\\.junit\\.jupiter\\.api\\.Assertions\\b|org\\.junit\\.Assert\\b|junit\\.framework\\.Assert\\b|org\\.hamcrest\\.MatcherAssert\\b',
				'Assert with AssertJ (assertThat, assertThatThrownBy) instead of JUnit Assertions, JUnit 4 or 3 Assert, or Hamcrest MatcherAssert')
			// Naver naming 2.1 and 2.9 for test method names: English letters, digits and _ only, starting lowercase.
			// A lint, like the assertion ban, also runs for API-documentation-only PRs, where CI skips ArchUnit.
			// It reads void method declarations only; review covers test factories that return a value.
			// \p{IsHangul} also matches decomposed jamo.
			forbidRegex('Method name in Korean or starting uppercase',
				'\\bvoid\\s+(?:[A-Z]|[^\\s(]*\\p{IsHangul})[^\\s(]*\\s*\\(',
				'Name methods in lowerCamelCase English (Naver 2.1, 2.9); put a Korean description in @DisplayName')
			// Spring Boot 3.4 deprecated @MockBean and @SpyBean in favor of @MockitoBean and @MockitoSpyBean.
			forbidRegex('Deprecated Spring mock bean annotation', '@(MockBean|SpyBean)\\b',
				'Use @MockitoBean or @MockitoSpyBean')
			// Pinned so that a Spotless upgrade does not change the formatter (eclipse-formatter in libs.versions.toml).
			eclipse(libs.versions.eclipse.formatter.get()).configFile(rootProject.file('config/formatter/naver-eclipse-formatter.xml'))
		}
		// Tests mock with BDDMockito (given, then, will...). See docs/development/coding-convention.md ("테스트").
		// Unprefixed calls and Mockito.x(...) are checked; inOrder.verify(...) and lenient().when(...) are not.
		format 'testMocks', {
			target 'src/test/java/**/*.java'
			forbidRegex('Mockito stubbing or verification',
				'(?<![.\\w])(when|verify|verifyNoInteractions|verifyNoMoreInteractions|doReturn|doThrow|doAnswer|doNothing|doCallRealMethod)\\(|\\b(?:BDD)?Mockito\\.(when|verify\\w*|do[A-Z]\\w*)\\(',
				'Use BDDMockito: given(...).willReturn(...), willThrow(...).given(mock), then(mock).should()')
		}
	}
}
